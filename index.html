<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>DinoNest Labs — Adaptive Learning Adventure</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./assets/chibi/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap');

    :root {
      --bg-sky: #f0f9ff;
      --card-border: #e2e8f0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(180deg, #e0f2fe 0%, #f8fafc 45%, #fefce8 100%);
      min-height: 100vh;
      color: #1e293b;
    }

    h1, h2, h3, .font-display {
      font-family: 'Fredoka', sans-serif;
    }

    @keyframes buddyIdle {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-6px) scale(1.02); }
    }

    @keyframes buddyCelebrate {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      25% { transform: translateY(-18px) rotate(-6deg) scale(1.08); }
      50% { transform: translateY(-4px) rotate(6deg) scale(1.05); }
      75% { transform: translateY(-14px) rotate(-3deg) scale(1.07); }
    }

    @keyframes buddyEncourage {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(-7deg); }
      70% { transform: rotate(7deg); }
    }

    .buddy-idle {
      animation: buddyIdle 3.2s ease-in-out infinite;
    }

    .buddy-celebrate {
      animation: buddyCelebrate 0.85s ease-in-out 2;
    }

    .buddy-encourage {
      animation: buddyEncourage 0.65s ease-in-out 2;
    }

    .choice-btn {
      transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
    }

    .choice-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -4px rgba(14, 116, 144, 0.18);
    }

    .choice-btn:active:not(:disabled) {
      transform: translateY(0px);
    }
  </style>
</head>

    const HOLIDAYS = [

      { key: 'new_years',     label: "New Year's",        img: './assets/chibi/holidays/new_years.jpg' },
      { key: 'mlk_day',       label: 'MLK Day',           img: './assets/chibi/holidays/mlk_day.jpg' },
      { key: 'presidents_day',label: "Presidents' Day",   img: './assets/chibi/holidays/presidents_day.jpg' },
      { key: 'st_patricks',   label: "St. Patrick's Day", img: './assets/chibi/holidays/st_patricks.jpg' },

    const SUBJECTS = [
      { key: 'math',    label: 'Math Quest',       icon: '🔢', desc: 'Number sense, operations, fractions & logic' },

    // =========================================================================
    // 2. STATE & PERSISTENCE
    // =========================================================================
    const STORAGE_KEY = 'dinonest_labs_2d_v1';

    function detectTodayHoliday() {
      const now = new Date();
      const m = now.getMonth() + 1;
      const d = now.getDate();
      if (m === 1 && d <= 7) return 'new_years';
      if (m === 1 && d >= 15 && d <= 21) return 'mlk_day';
      if (m === 2 && d >= 12 && d <= 15) return 'valentines';
      if (m === 2 && d >= 16 && d <= 22) return 'presidents_day';
      if (m === 3 && d >= 14 && d <= 18) return 'st_patricks';
      if (m === 4 && d <= 20) return 'easter';
      if (m === 5 && d >= 24) return 'memorial_day';
      if (m === 6 && d >= 17 && d <= 20) return 'juneteenth';
      if (m === 7 && d <= 6) return 'july_4th';
      if (m === 9 && d <= 7) return 'labor_day';
      if (m === 10 && d >= 24) return 'halloween';
      if (m === 11 && d >= 20 && d <= 29) return 'thanksgiving';
      if (m === 12 && d >= 15) return 'christmas';
      return '';
    }

    const defaultState = {
      studentName: 'Explorer',
      birthdayMonth: '',
      birthdayDay: '',
      grade: 2,
      subject: 'math',
      tab: 'practice', // 'practice' | 'nest' | 'minigames' | 'progress'
      activeDinoId: 'image_0',
      activeHoliday: detectTodayHoliday(),
      unlockedDinos: ['image_0', 'image_1'],
      stars: 25,
      xp: 0,
      streak: 0,
      bestStreak: 0,
      difficultyIdx: 0,
      solvedCount: 0,
      correctCount: 0,
      subjectStats: {
        math: { solved: 0, correct: 0 },
        reading: { solved: 0, correct: 0 },
        science: { solved: 0, correct: 0 }
      }
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...defaultState };
        const parsed = JSON.parse(raw);
        return {
          ...defaultState,
          ...parsed,
          subjectStats: { ...defaultState.subjectStats, ...(parsed.subjectStats || {}) }
        };
      } catch {
        return { ...defaultState };
      }
    }

    let state = loadState();

    // Check Astra birthday unlock automatically
    function checkBirthdayUnlock() {
      if (!state.birthdayMonth || !state.birthdayDay) return false;
      const now = new Date();
      const isBday = (now.getMonth() + 1) === Number(state.birthdayMonth) && now.getDate() === Number(state.birthdayDay);
      if (isBday && !state.unlockedDinos.includes('image_12')) {
        state.unlockedDinos.push('image_12');
        state.activeDinoId = 'image_12';
        saveState();
        return true;
      }
      return isBday;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {}
    }

    // Transient UI state (not saved)
    let currentQuestion = null;
    let selectedAnswer = null;
    let answerResult = null; // null | 'correct' | 'wrong'
    let showExplanation = false;
    let buddyMood = 'idle'; // 'idle' | 'celebrate' | 'encourage'
    let bannerMessage = '';

    // Mini-game state
    let activeMiniGame = 'memory'; // 'memory' | 'sprint'
    let memoryCards = [];
    let flippedIndices = [];
    let matchedPairs = 0;
    let memoryMoves = 0;
    let memoryLock = false;

    let sprintScore = 0;
    let sprintTimeLeft = 30;
    let sprintRunning = false;
    let sprintQuestion = null;
    let sprintTimerId = null;

    // =========================================================================
    // 3. ADAPTIVE QUESTION ENGINE (GRADES 1–6, MATH / READING / SCIENCE)
    // =========================================================================
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function makeNumericChoices(correct, spread = 8) {
      const set = new Set([correct]);
      let guard = 0;
      while (set.size < 4 && guard < 60) {
        guard++;
        const offset = randInt(-spread, spread);
        const candidate = correct + offset;
        if (candidate >= 0 && candidate !== correct) {
          set.add(candidate);
        }
      }
      while (set.size < 4) set.add(correct + set.size + 1);
      return shuffle([...set].map(String));
    }

    function generateMathQuestion(grade, diffIdx) {
      const scale = grade + diffIdx;
      const mode = randInt(1, 4);

      if (grade <= 2) {
        if (mode === 1) {
          const a = randInt(3, 12 + scale * 4);
          const b = randInt(2, 10 + scale * 3);
          const ans = a + b;
          return {
            tag: `Grade ${grade} • Addition`,
            prompt: `Pip found ${a} fern leaves in the morning and ${b} more after lunch. How many leaves did Pip find in all?`,
            equation: `${a} + ${b} = ?`,
            choices: makeNumericChoices(ans, 6),
            answer: String(ans),
            hint: `Start at ${a} and count up ${b} more.`,
            explanation: `${a} + ${b} = ${ans}. Combining both groups gives ${ans} leaves total.`
          };
        }
        if (mode === 2) {
          const total = randInt(10, 18 + scale * 4);
          const eaten = randInt(2, total - 3);
          const ans = total - eaten;
          return {
            tag: `Grade ${grade} • Subtraction`,
            prompt: `There were ${total} dino eggs in the warm nest, and ${eaten} hatched! How many eggs are still in the nest?`,
            equation: `${total} − ${eaten} = ?`,
            choices: makeNumericChoices(ans, 5),
            answer: String(ans),
            hint: `Subtract ${eaten} from ${total}.`,
            explanation: `${total} − ${eaten} = ${ans} eggs left in the nest.`
          };
        }
        if (mode === 3) {
          const step = grade === 1 ? 2 : [2, 5, 10][randInt(0, 2)];
          const start = randInt(1, 5) * step;
          const seq = [start, start + step, start + step * 2, start + step * 3];
          const ans = start + step * 4;
          return {
            tag: `Grade ${grade} • Number Patterns`,
            prompt: `Follow the dino footprints! What number comes next in this pattern?`,
            equation: `${seq.join(', ')}, ?`,
            choices: makeNumericChoices(ans, step * 2),
            answer: String(ans),
            hint: `Each footprint adds ${step} to the number before it.`,
            explanation: `The pattern counts by ${step}s: ${seq[3]} + ${step} = ${ans}.`
          };
        }
        const tens = randInt(2, 8);
        const ones = randInt(1, 9);
        const ans = tens * 10 + ones;
        return {
          tag: `Grade ${grade} • Place Value`,
          prompt: `Which number is equal to ${tens} tens and ${ones} ones?`,
          equation: `${tens} tens + ${ones} ones`,
          choices: shuffle([String(ans), String(ones * 10 + tens), String(tens + ones), String(ans + 10)]),
          answer: String(ans),
          hint: `${tens} tens is ${tens * 10}. Now add ${ones} ones.`,
          explanation: `${tens} tens = ${tens * 10}, plus ${ones} ones = ${ans}.`
        };
      }

      if (grade <= 4) {
        if (mode === 1) {
          const a = randInt(3, 8 + diffIdx * 2);
          const b = randInt(4, 9 + diffIdx * 2);
          const ans = a * b;
          return {
            tag: `Grade ${grade} • Multiplication`,
            prompt: `Trixie arranged ${a} rows of crystals with ${b} crystals in each row. How many crystals are there altogether?`,
            equation: `${a} × ${b} = ?`,
            choices: makeNumericChoices(ans, 10),
            answer: String(ans),
            hint: `Think of ${a} equal groups of ${b}.`,
            explanation: `${a} × ${b} = ${ans} crystals.`
          };
        }
        if (mode === 2) {
          const divisor = randInt(3, 8 + diffIdx);
          const quotient = randInt(4, 10 + diffIdx);
          const dividend = divisor * quotient;
          return {
            tag: `Grade ${grade} • Division`,
            prompt: `${dividend} berries are shared equally among ${divisor} baby dinos. How many berries does each dino get?`,
            equation: `${dividend} ÷${divisor} = ?`,
            choices: makeNumericChoices(quotient, 5),
            answer: String(quotient),
            hint: `Ask yourself: ${divisor} times what number equals ${dividend}?`,
            explanation: `Since ${divisor} × ${quotient} =${dividend}, ${dividend} ÷${divisor} = ${quotient}.`
          };
        }
        if (mode === 3) {
          const denom = [4, 5, 6, 8, 10][randInt(0, 4)];
          const num1 = randInt(1, denom - 2);
          const num2 = randInt(1, denom - num1);
          const ans = `${num1 + num2}/${denom}`;
          const wrong1 = `${num1 + num2}/${denom * 2}`;
          const wrong2 = `${Math.max(1, num1 + num2 - 1)}/${denom}`;
          const wrong3 = `${num1 * num2}/${denom}`;
          return {
            tag: `Grade ${grade} • Fractions`,
            prompt: `Anky ate ${num1}/${denom} of a melon and Sunny ate ${num2}/${denom} of the same melon. How much did they eat together?`,
            equation: `${num1}/${denom} + ${num2}/${denom} = ?`,
            choices: shuffle([...new Set([ans, wrong1, wrong2, wrong3])]),
            answer: ans,
            hint: `When denominators match, add the top numbers (numerators) and keep the bottom number (${denom}).`,
            explanation: `${num1}/${denom} + ${num2}/${denom} = ${ans}.`
          };
        }
        const w = randInt(4, 11);
        const l = randInt(5, 13);
        const ans = 2 * (w + l);
        return {
          tag: `Grade ${grade} • Perimeter`,
          prompt: `A rectangular dino habitat is ${l} meters long and${w} meters wide. What is its perimeter?`,
          equation: `P = 2 × (${l} +${w})`,
          choices: makeNumericChoices(ans, 8),
          answer: String(ans),
          hint: `Add all four sides: ${l} +${w} + ${l} +${w}.`,
          explanation: `Perimeter = ${l} +${w} + ${l} +${w} = ${ans} meters.`
        };
      }

      // Grades 5–6
      if (mode === 1) {
        const a = randInt(6, 15 + diffIdx * 3);
        const b = randInt(4, 12 + diffIdx * 2);
        const c = randInt(5, 25);
        const ans = a * b + c;
        return {
          tag: `Grade ${grade} • Order of Operations`,
          prompt: `Evaluate the expression carefully using order of operations:`,
          equation: `${a} ×${b} + ${c} = ?`,
          choices: makeNumericChoices(ans, 14),
          answer: String(ans),
          hint: `Multiply ${a} × ${b} first, then add${c}.`,
          explanation: `First multiply: ${a} × ${b} =${a * b}. Then add ${c}: ${a * b} +${c} = ${ans}.`
        };
      }
      if (mode === 2) {
        const pct = [10, 20, 25, 50][randInt(0, 3)];
        const base = pct === 25 ? randInt(2, 12) * 4 : randInt(3, 15) * 10;
        const ans = (pct / 100) * base;
        return {
          tag: `Grade ${grade} • Percentages`,
          prompt: `Astra scanned ${base} asteroids and found rare minerals on${pct}% of them. How many asteroids had rare minerals?`,
          equation: `${pct}% of ${base} = ?`,
          choices: makeNumericChoices(ans, 10),
          answer: String(ans),
          hint: `Convert ${pct}% to a fraction (${pct}/100) and multiply by${base}.`,
          explanation: `${pct}% of${base} = (${pct}/100) ×${base} = ${ans}.`
        };
      }
      const x = randInt(3, 14 + diffIdx * 2);
      const mult = randInt(2, 6);
      const add = randInt(3, 15);
      const total = mult * x + add;
      return {
        tag: `Grade ${grade} • Pre-Algebra`,
        prompt: `Solve for x in the cosmic equation below:`,
        equation: `${mult}x + ${add} =${total}`,
        choices: makeNumericChoices(x, 5),
        answer: String(x),
        hint: `Subtract ${add} from${total} first, then divide by ${mult}.`,
        explanation: `${total} − ${add} =${total - add}, and ${total - add} ÷${mult} = ${x}.`
      };
    }

    const READING_BANK = [
      // Lower Grades (1–3)
      { minG: 1, maxG: 3, tag: 'Vocabulary • Synonyms', prompt: 'In the sentence "Pip was ecstatic when the egg hatched," what does ecstatic mean?', equation: '"Pip was ecstatic!"', choices: ['Very happy and excited', 'Sleepy and tired', 'Afraid of loud noises', 'Hungry for leaves'], answer: 'Very happy and excited', hint: 'Think about how you feel when something wonderful happens!', explanation: 'Ecstatic means feeling overwhelming happiness and excitement.' },
      { minG: 1, maxG: 3, tag: 'Vocabulary • Antonyms', prompt: 'Which word is the opposite (antonym) of "ancient"?', equation: 'Antonym of ANCIENT', choices: ['Modern', 'Huge', 'Rocky', 'Fossilized'], answer: 'Modern', hint: 'Ancient means very, very old.', explanation: 'Ancient means from long ago, so its opposite is modern (new or current).' },
      { minG: 1, maxG: 3, tag: 'Grammar • Parts of Speech', prompt: 'Which word in this sentence is an action verb? "Veloci sprinted across the canyon."', equation: '"Veloci sprinted across the canyon."', choices: ['sprinted', 'Veloci', 'canyon', 'across'], answer: 'sprinted', hint: 'Look for the word that tells what Veloci did.', explanation: '"Sprinted" is the verb because it shows the action Veloci performed.' },
      { minG: 1, maxG: 3, tag: 'Context Clues', prompt: '"The towering Brachiosaurus nibbled leaves from the canopy." What is a canopy here?', equation: 'Context Clue: CANOPY', choices: ['The high leafy tops of trees', 'An underground cave', 'A muddy riverbank', 'A pile of pebbles'], answer: 'The high leafy tops of trees', hint: 'Brachiosaurus has a super long neck to reach high places.', explanation: 'In a forest, the canopy is the upper layer formed by the leafy tops of tall trees.' },
      { minG: 1, maxG: 3, tag: 'Spelling & Plurals', prompt: 'Choose the correct plural word to finish the sentence: "Two baby _____ were sleeping by the pond."', equation: 'Plural of FOX', choices: ['foxes', 'foxs', 'foxies', 'foxen'], answer: 'foxes', hint: 'Words ending in -x add -es to become plural.', explanation: 'Because "fox" ends in x, we add -es to spell "foxes".' },
      // Upper Grades (4–6)
      { minG: 4, maxG: 6, tag: 'Context Clues', prompt: '"Even during the fierce meteor shower, Anky remained resilient and calm." What does resilient mean?', equation: 'Context Clue: RESILIENT', choices: ['Able to recover quickly from challenges', 'Easily frightened', 'Unable to move', 'Loud and boastful'], answer: 'Able to recover quickly from challenges', hint: 'Notice how Anky stayed calm during a tough situation.', explanation: 'Resilient describes someone who stays strong and bounces back quickly from difficulties.' },
      { minG: 4, maxG: 6, tag: 'Figurative Language', prompt: 'Identify the type of figurative language: "The volcano roared like an angry dragon."', equation: '"roared like an angry dragon"', choices: ['Simile', 'Alliteration', 'Hyperbole', 'Onomatopoeia'], answer: 'Simile', hint: 'Notice the comparison word "like".', explanation: 'A simile compares two different things using the words "like" or "as".' },
      { minG: 4, maxG: 6, tag: 'Word Roots & Prefixes', prompt: 'The prefix "geo-" means Earth. What does "geology" most likely mean?', equation: 'Prefix: GEO- + -OLOGY', choices: ['The study of Earth and its rocks', 'The study of ocean stars', 'A tool for measuring wind', 'A map of constellations'], answer: 'The study of Earth and its rocks', hint: '"-ology" means the study of something.', explanation: 'Geo (Earth) + -ology (study of) = geology, the science of Earth’s rocks and structure.' },
      { minG: 4, maxG: 6, tag: 'Main Idea & Inference', prompt: '"Plesio’s flippers were shaped like underwater wings, letting it glide effortlessly for miles." What can you infer?', equation: 'Reading Inference', choices: ['Plesio was built for long-distance swimming', 'Plesio could fly above clouds', 'Plesio lived in dry deserts', 'Plesio never entered the water'], answer: 'Plesio was built for long-distance swimming', hint: 'Focus on the words "underwater wings" and "glide effortlessly for miles".', explanation: 'Flippers shaped like underwater wings show Plesio was well adapted for efficient swimming.' },
      { minG: 4, maxG: 6, tag: 'Vocabulary • Precision', prompt: 'Which word best replaces "looked closely" in: "Spike looked closely at the mysterious fossil imprint"?', equation: 'Word Choice Upgrade', choices: ['examined', 'ignored', 'tossed', 'guessed'], answer: 'examined', hint: 'Pick the word a scientist would use when inspecting evidence.', explanation: '"Examined" means inspected carefully and in detail.' }
    ];

    const SCIENCE_BANK = [
      { minG: 1, maxG: 3, tag: 'Dino Diets', prompt: 'Ankylosaurus and Triceratops ate only plants, leaves, and ferns. What kind of eaters were they?', equation: 'Dino Diet Classification', choices: ['Herbivores', 'Carnivores', 'Decomposers', 'Pollinators'], answer: 'Herbivores', hint: 'Think of the word "herb" (plant).', explanation: 'Herbivores are animals that eat only plants.' },
      { minG: 1, maxG: 3, tag: 'Earth & Fossils', prompt: 'What do scientists call the preserved traces or remains of ancient plants and dinosaurs in rock?', equation: 'Paleontology Basics', choices: ['Fossils', 'Crystals', 'Comets', 'Glaciers'], answer: 'Fossils', hint: 'Paleontologists dig these up to learn about prehistoric life.', explanation: 'Fossils are preserved remains or imprints of ancient living things.' },

    ];

    function buildQuestion() {
      if (state.subject === 'math') {
        return generateMathQuestion(state.grade, state.difficultyIdx);
      }
      const bank = state.subject === 'reading' ? READING_BANK : SCIENCE_BANK;
      const pool = bank.filter(q => state.grade >= q.minG && state.grade <= q.maxG);
      const chosen = (pool.length ? pool : bank)[randInt(0, (pool.length ? pool : bank).length - 1)];
      return {
        ...chosen,
        choices: shuffle(chosen.choices)
      };
    }

    function nextQuestion() {
      currentQuestion = buildQuestion();
      selectedAnswer = null;
      answerResult = null;
      showExplanation = false;
      buddyMood = 'idle';
      render();
    }

    // =========================================================================
    // 4. HELPER FUNCTIONS (ACTIVE DINO & 2D IMAGE RESOLUTION)
    // =========================================================================
    function getActiveDino() {
      return DINOS.find(d => d.id === state.activeDinoId) || DINOS[0];
    }

    function getActiveBuddyImage() {
      const holidayObj = HOLIDAYS.find(h => h.key === state.activeHoliday);
      if (holidayObj && holidayObj.img) {
        return holidayObj.img;
      }
      return getActiveDino().img;
    }

    function getActiveHolidayLabel() {
      const holidayObj = HOLIDAYS.find(h => h.key === state.activeHoliday);
      return holidayObj && holidayObj.key ? holidayObj.label : 'Classic Chibi';
    }

    // =========================================================================
    // 5. ACTIONS
    // =========================================================================
    function submitAnswer(choice) {
      if (answerResult !== null) return;
      selectedAnswer = choice;
      state.solvedCount += 1;
      state.subjectStats[state.subject].solved += 1;

      if (choice === currentQuestion.answer) {
        answerResult = 'correct';
        buddyMood = 'celebrate';
        state.correctCount += 1;
        state.subjectStats[state.subject].correct += 1;
        state.streak += 1;
        state.bestStreak = Math.max(state.bestStreak, state.streak);

        const bonus = state.streak >= 3 ? 5 : 0;
        const earnedStars = 5 + bonus;
        state.stars += earnedStars;
        state.xp += 15 + state.difficultyIdx * 5;

        if (state.streak > 0 && state.streak % 3 === 0 && state.difficultyIdx < DIFFICULTY_LEVELS.length - 1) {
          state.difficultyIdx += 1;
          bannerMessage = `🔥 ${state.streak}-in-a-row! Level up to ${DIFFICULTY_LEVELS[state.difficultyIdx]} (+${earnedStars} ⭐)!`;
        } else {
          bannerMessage = `🎉 Awesome job! +${earnedStars} Dino Stars${bonus ? ' (Streak Bonus!)' : ''}`;
        }
      } else {
        answerResult = 'wrong';
        buddyMood = 'encourage';
        showExplanation = true;
        state.streak = 0;
        if (state.difficultyIdx > 0) {
          state.difficultyIdx -= 1;
        }
        bannerMessage = `💡 Nice try! Let’s walk through the steps together.`;
      }

      saveState();
      render();
    }

    function setGrade(g) {
      state.grade = g;
      saveState();
      nextQuestion();
    }

    function setSubject(subj) {
      state.subject = subj;
      saveState();
      nextQuestion();
    }

    function setTab(tab) {
      if (sprintTimerId && tab !== 'minigames') {
        stopSprint();
      }
      state.tab = tab;
      if (tab === 'minigames' && memoryCards.length === 0) {
        initMemoryGame();
      }
      saveState();
      render();
    }

    function selectDino(id) {
      if (!state.unlockedDinos.includes(id)) return;
      state.activeDinoId = id;
      state.activeHoliday = ''; // Show the selected dino's PNG first
      buddyMood = 'celebrate';
      saveState();
      render();
    }

    function unlockDino(id) {
      const dino = DINOS.find(d => d.id === id);
      if (!dino || state.unlockedDinos.includes(id)) return;
      if (state.stars < dino.cost) return;
      state.stars -= dino.cost;
      state.unlockedDinos.push(id);
      state.activeDinoId = id;
      state.activeHoliday = '';
      buddyMood = 'celebrate';
      bannerMessage = `🥚 Hatched ${dino.name} the${dino.species}!`;
      saveState();
      render();
    }

    function setHoliday(key) {
      state.activeHoliday = key;
      buddyMood = 'celebrate';
      saveState();
      render();
    }

    function updateProfileField(field, value) {
      state[field] = value;
      checkBirthdayUnlock();
      saveState();
      render();
    }

    // =========================================================================
    // 6. 2D MINI-GAMES (USING ONLY YOUR CHIBI PNGS & HOLIDAY JPGS)
    // =========================================================================
    function initMemoryGame() {
      const pool = shuffle(DINOS).slice(0, 6);
      const deck = shuffle([...pool, ...pool]).map((dino, idx) => ({
        uid: idx,
        id: dino.id,
        name: dino.name,
        img: dino.img,
        matched: false
      }));
      memoryCards = deck;
      flippedIndices = [];
      matchedPairs = 0;
      memoryMoves = 0;
      memoryLock = false;
    }

    function flipMemoryCard(index) {
      if (memoryLock) return;
      const card = memoryCards[index];
      if (!card || card.matched || flippedIndices.includes(index)) return;

      flippedIndices.push(index);
      render();

      if (flippedIndices.length === 2) {
        memoryMoves += 1;
        memoryLock = true;
        const [i1, i2] = flippedIndices;
        if (memoryCards[i1].id === memoryCards[i2].id) {
          setTimeout(() => {
            memoryCards[i1].matched = true;
            memoryCards[i2].matched = true;
            flippedIndices = [];
            matchedPairs += 1;
            memoryLock = false;
            if (matchedPairs === 6) {
              state.stars += 15;
              state.xp += 30;
              saveState();
            }
            render();
          }, 420);
        } else {
          setTimeout(() => {
            flippedIndices = [];
            memoryLock = false;
            render();
          }, 750);
        }
      }
    }

    function makeSprintPrompt() {
      const max = state.grade * 6 + 6;
      const a = randInt(1, max);
      const b = randInt(1, max);
      const isAdd = Math.random() > 0.35 || a < b;
      const ans = isAdd ? a + b : a - b;
      return {
        text: isAdd ? `${a} +${b}` : `${a} −${b}`,
        answer: String(ans),
        choices: makeNumericChoices(ans, 5)
      };
    }

    function startSprint() {
      stopSprint();
      sprintScore = 0;
      sprintTimeLeft = 30;
      sprintRunning = true;
      sprintQuestion = makeSprintPrompt();
      render();

      sprintTimerId = setInterval(() => {
        sprintTimeLeft -= 1;
        if (sprintTimeLeft <= 0) {
          stopSprint(true);
        } else {
          render();
        }
      }, 1000);
    }

    function stopSprint(completed = false) {
      if (sprintTimerId) {
        clearInterval(sprintTimerId);
        sprintTimerId = null;
      }
      if (completed && sprintRunning && sprintScore > 0) {
        state.stars += sprintScore * 2;
        state.xp += sprintScore * 5;
        saveState();
      }
      sprintRunning = false;
      render();
    }

    function answerSprint(choice) {
      if (!sprintRunning || !sprintQuestion) return;
      if (choice === sprintQuestion.answer) {
        sprintScore += 1;
      }
      sprintQuestion = makeSprintPrompt();
      render();
    }
