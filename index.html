<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DinoNest Labs — Interactive 3D Beta</title>
  <style>
    :root {
      --bg: #0f141c;
      --panel: #171e2b;
      --panel-2: #1f293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #34d399;
      --warn: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.2px;
    }

    .brand-sub {
      font-size: 0.85rem;
      color: var(--accent);
    }

    .top-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    select, button, textarea, input {
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 11px;
    }

    button {
      cursor: pointer;
      transition: background 0.15s ease, transform 0.12s ease, border-color 0.15s ease;
    }

    button:hover {
      background: #2b384e;
      border-color: #475569;
    }

    button:active {
      transform: scale(0.98);
    }

    button.active {
      background: #0369a1;
      border-color: var(--accent);
      color: #ffffff;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(300px, 1fr);
      gap: 14px;
      padding: 14px 18px;
      align-items: stretch;
    }

    @media (max-width: 920px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }

    .stage-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stage-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .mode-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 56vh;
      min-height: 360px;
      background: radial-gradient(circle at 50% 35%, #1e293b 0%, #0b0f17 80%);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #263244;
    }

    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    #fallback-2d {
      display: none;
      max-width: 68%;
      max-height: 75%;
      object-fit: contain;
      border-radius: 14px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.25s ease, filter 0.25s ease, opacity 0.3s ease;
    }

    .fallback-hop {
      transform: translateY(-18px) scale(1.06) !important;
    }

    .fallback-spin {
      transform: scaleX(-1) !important;
    }

    .fallback-breathe-in {
      transform: scale(1.12) !important;
    }

    .fallback-breathe-out {
      transform: scale(0.94) !important;
    }

    .fallback-quiet {
      opacity: 0.72;
      filter: saturate(0.75);
    }

    .reaction-banner {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 20, 28, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.28);
      backdrop-filter: blur(6px);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      pointer-events: none;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .activity-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-section {
      background: var(--panel-2);
      border: 1px solid #2d3b52;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel-title {
      font-weight: 650;
      font-size: 0.98rem;
      color: var(--accent);
    }

    .muted {
      font-size: 0.86rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .stat-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.88rem;
      color: var(--accent-2);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .breath-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: #131a26;
      border-radius: 10px;
    }

    .breath-cue {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-2);
    }

    .fidget-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .fidget-pop {
      height: 54px;
      font-weight: 700;
      background: #27354d;
    }

    .fidget-pop.popped {
      background: #047857;
      border-color: var(--accent-2);
    }

    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      line-height: 1.45;
    }

    .prompt-chip {
      font-size: 0.8rem;
      padding: 6px 9px;
      background: #162030;
    }

    footer {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 10px 18px;
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-title">DinoNest Labs — 3D Interactive Beta</div>
      <div class="brand-sub" id="active-dino-label">Loading...</div>
    </div>

    <div class="top-controls">
      <select id="standard-select" aria-label="Standard Dinos"></select>
      <select id="holiday-select" aria-label="Holiday Dinos"></select>
      <button id="random-dino-btn" type="button">Random Dino</button>
    </div>
  </header>

  <main class="workspace">
    <section class="stage-card">
      <div class="stage-toolbar">
        <div class="mode-tabs" role="tablist" aria-label="App Modes">
          <button id="tab-play" class="active" type="button">Interactive Play</button>
          <button id="tab-games" type="button">Mini-Games</button>
          <button id="tab-coping" type="button">Coping Skills</button>
        </div>
        <div class="muted">Drag to look around • Click/tap dino to react</div>
      </div>

      <div id="stage">
        <canvas id="three-canvas"></canvas>
        <img id="fallback-2d" alt="2D Dino Portrait" />
        <div class="reaction-banner" id="reaction-banner">Dino ready!</div>
      </div>

      <div class="quick-actions">
        <button id="hop-btn" type="button">Happy Hop</button>
        <button id="spin-btn" type="button">Spin</button>
        <button id="center-btn" type="button">Center Dino</button>
        <button id="reset-cam-btn" type="button">Reset Camera</button>
      </div>
    </section>

    <aside class="activity-panel" id="activity-panel"></aside>
  </main>

  <footer>
    <div id="asset-status">Asset status: initializing...</div>
    <div>Audio pass deferred to post-3D beta</div>
  </footer>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =========================================================================
    // 1. ASSET REGISTRY (Standard = .png 2D / .glb 3D, Holiday = .jpg 2D / .glb 3D)
    // =========================================================================
    const STANDARD_DINOS = [
      { key: 'image_0',  name: 'Pip',    species: 'T-Rex' },
      { key: 'image_1',  name: 'Trixie', species: 'Triceratops' },
      { key: 'image_2',  name: 'Bram',   species: 'Brachiosaurus' },
      { key: 'image_3',  name: 'Sunny',  species: 'Stegosaurus' },
      { key: 'image_4',  name: 'Pia',    species: 'Pterodactyl' },
      { key: 'image_5',  name: 'Anky',   species: 'Ankylosaurus' },
      { key: 'image_6',  name: 'Pari',   species: 'Parasaurolophus' },
      { key: 'image_7',  name: 'Veloci', species: 'Velociraptor' },
      { key: 'image_8',  name: 'Plesio', species: 'Plesiosaurus' },
      { key: 'image_9',  name: 'Spike',  species: 'Spinosaurus' },
      { key: 'image_10', name: 'Dippy',  species: 'Diplodocus' },
      { key: 'image_11', name: 'Pachy',  species: 'Pachycephalosaurus' },
      { key: 'image_12', name: 'Astra',  species: 'Birthday Star-Dino' }
    ].map(d => ({
      ...d,
      title: `${d.name} (${d.species})`,
      type: 'standard',
      glbUrl: `./assets/models/${d.key}.glb`,
      fallbackUrl: `./assets/chibi/${d.key}.png`
    }));

    const HOLIDAY_DINOS = [
      { key: 'christmas',      label: 'Christmas' },
      { key: 'easter',         label: 'Easter' },
      { key: 'halloween',      label: 'Halloween' },
      { key: 'july_4th',       label: 'Independence Day' },
      { key: 'juneteenth',     label: 'Juneteenth' },
      { key: 'labor_day',      label: 'Labor Day' },
      { key: 'memorial_day',   label: 'Memorial Day' },
      { key: 'mlk_day',        label: 'MLK Jr. Day' },
      { key: 'new_years',      label: "New Year's Day" },
      { key: 'presidents_day', label: "Presidents' Day" },
      { key: 'st_patricks',    label: "St. Patrick's Day" },
      { key: 'thanksgiving',   label: 'Thanksgiving' },
      { key: 'valentines',     label: "Valentine's Day" }
    ].map(h => ({
      ...h,
      name: h.label,
      species: 'Holiday Variant',
      title: `${h.label} Dino`,
      type: 'holiday',
      glbUrl: `./assets/models/holidays/${h.key}.glb`,
      fallbackUrl: `./assets/chibi/holidays/${h.key}.jpg`
    }));

    const ALL_DINOS = [...STANDARD_DINOS, ...HOLIDAY_DINOS];

    // =========================================================================
    // 2. DEFERRED AUDIO & EVENT HOOKS (Wired cleanly for later audio pass)
    // =========================================================================
    function playDinoAudio(_eventType, _payload = {}) {
      // Placeholder hook for future audio integration
    }

    function onGameEvent(_eventName, _detail = {}) {
      // Placeholder hook for future game sound/feedback integration
    }

    // =========================================================================
    // 3. THREE.JS SCENE, LOADER, FALLBACK & WHOLE-DINO MOTION CONTROLLER
    // =========================================================================
    const stageEl = document.getElementById('stage');
    const canvas = document.getElementById('three-canvas');
    const fallbackImgEl = document.getElementById('fallback-2d');
    const reactionBanner = document.getElementById('reaction-banner');
    const assetStatusEl = document.getElementById('asset-status');
    const activeDinoLabel = document.getElementById('active-dino-label');

    const scene = new THREE.Scene();

    // Subtle ground reference ring so movement & targets read clearly
    const groundRing = new THREE.Mesh(
      new THREE.RingGeometry(0.1, 2.35, 48),
      new THREE.MeshBasicMaterial({
        color: 0x334155,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.25
      })
    );
    groundRing.rotation.x = -Math.PI / 2;
    groundRing.position.y = -0.95;
    scene.add(groundRing);

    // Fetch / star target prop used in Fetch & Deliver game
    const targetProp = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.24, 0),
      new THREE.MeshStandardMaterial({
        color: 0xfbbf24,
        emissive: 0x78350f,
        roughness: 0.3,
        metalness: 0.2
      })
    );
    targetProp.visible = false;
    scene.add(targetProp);

    const camera = new THREE.PerspectiveCamera(
      45,
      stageEl.clientWidth / Math.max(stageEl.clientHeight, 1),
      0.1,
      100
    );
    camera.position.set(0, 1.3, 4.0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(stageEl.clientWidth, stageEl.clientHeight, false);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 1.35));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.65);
    keyLight.position.set(3, 5, 4);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x93c5fd, 0.7);
    fillLight.position.set(-4, 2, -2);
    scene.add(fillLight);

    const loader = new GLTFLoader();
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    // Wrapper pivot holds normalized model so we can move/spin/hop cleanly
    const dinoPivot = new THREE.Group();
    scene.add(dinoPivot);
    let currentModelMesh = null;
    let activeDino = STANDARD_DINOS[0];
    let usingFallback2D = false;

    // Motion & reaction state
    const dinoMotion = {
      mode: 'idle', // 'idle' | 'moveTo' | 'hop' | 'spin' | 'breathe' | 'quiet'
      targetPos: new THREE.Vector3(0, 0, 0),
      baseY: 0,
      hopTimer: 0,
      spinRemaining: 0,
      breathPhase: 0
    };

    function setBanner(text) {
      reactionBanner.textContent = text;
    }

    function normalizeModel(root, targetSize = 1.9) {
      const box = new THREE.Box3().setFromObject(root);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);

      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scale = targetSize / maxDim;
      root.scale.setScalar(scale);

      root.position.set(
        -center.x * scale,
        -center.y * scale,
        -center.z * scale
      );
    }

    function apply2DFallback(dino, reason) {
      if (currentModelMesh) {
        dinoPivot.remove(currentModelMesh);
        currentModelMesh = null;
      }
      usingFallback2D = true;
      canvas.style.display = 'none';
      fallbackImgEl.src = dino.fallbackUrl;
      fallbackImgEl.style.display = 'block';
      assetStatusEl.textContent = `2D Fallback (${dino.fallbackUrl}) — ${reason}`;
    }

    function loadDino(dino) {
      activeDino = dino;
      activeDinoLabel.textContent = `Active: ${dino.title}`;
      assetStatusEl.textContent = `Loading 3D model: ${dino.glbUrl}...`;
      dinoPivot.position.set(0, 0, 0);
      dinoMotion.mode = 'idle';
      dinoMotion.baseY = 0;
      playDinoAudio('select_dino', { key: dino.key, type: dino.type });

      loader.load(
        dino.glbUrl,
        (gltf) => {
          if (currentModelMesh) {
            dinoPivot.remove(currentModelMesh);
          }
          currentModelMesh = gltf.scene;
          normalizeModel(currentModelMesh, 1.9);
          dinoPivot.add(currentModelMesh);

          usingFallback2D = false;
          fallbackImgEl.style.display = 'none';
          canvas.style.display = 'block';
          setBanner(`${dino.title} is ready!`);
          assetStatusEl.textContent = `Loaded 3D: ${dino.glbUrl}`;
        },
        undefined,
        () => {
          apply2DFallback(dino, `missing or unreadable ${dino.glbUrl}`);
          setBanner(`${dino.title} ready (2D portrait)`);
        }
      );
    }

    function triggerHop(label = null) {
      playDinoAudio('hop', { key: activeDino.key });
      if (usingFallback2D) {
        fallbackImgEl.classList.remove('fallback-hop');
        void fallbackImgEl.offsetWidth;
        fallbackImgEl.classList.add('fallback-hop');
        setTimeout(() => fallbackImgEl.classList.remove('fallback-hop'), 320);
      } else {
        dinoMotion.hopTimer = 0.45;
        dinoMotion.mode = 'hop';
      }
      setBanner(label || `${activeDino.name} did a happy hop!`);
    }

    function triggerSpin(label = null) {
      playDinoAudio('spin', { key: activeDino.key });
      if (usingFallback2D) {
        fallbackImgEl.classList.toggle('fallback-spin');
      } else {
        dinoMotion.spinRemaining = Math.PI * 2;
        dinoMotion.mode = 'spin';
      }
      setBanner(label || `${activeDino.name} spun around!`);
    }

    function moveDinoTo(x, z, label = null) {
      const clampedX = Math.max(-1.6, Math.min(1.6, x));
      const clampedZ = Math.max(-1.4, Math.min(1.2, z));
      dinoMotion.targetPos.set(clampedX, dinoMotion.baseY, clampedZ);
      dinoMotion.mode = 'moveTo';
      if (label) setBanner(label);
      playDinoAudio('move', { x: clampedX, z: clampedZ });
    }

    function centerDino() {
      moveDinoTo(0, 0, `${activeDino.name} returned to center.`);
    }

    function resetCamera() {
      camera.position.set(0, 1.3, 4.0);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    // =========================================================================
    // 4. CLICK / TAP INTERACTION ON 3D DINO & 2D FALLBACK
    // =========================================================================
    let pointerDownPos = { x: 0, y: 0 };
    let handleDinoTapCallback = null;

    canvas.addEventListener('pointerdown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    canvas.addEventListener('pointerup', (e) => {
      const movedDist = Math.hypot(
        e.clientX - pointerDownPos.x,
        e.clientY - pointerDownPos.y
      );
      // Treat short tap/click without camera drag as a dino interaction
      if (movedDist > 7 || !currentModelMesh || usingFallback2D) return;

      const rect = canvas.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObject(dinoPivot, true);
      if (hits.length > 0) {
        if (typeof handleDinoTapCallback === 'function') {
          handleDinoTapCallback();
        } else {
          triggerHop(`${activeDino.name} says hi!`);
        }
      }
    });

    fallbackImgEl.addEventListener('click', () => {
      if (typeof handleDinoTapCallback === 'function') {
        handleDinoTapCallback();
      } else {
        triggerHop(`${activeDino.name} says hi!`);
      }
    });

    // =========================================================================
    // 5. MODES: INTERACTIVE PLAY, MINI-GAMES & COPING SKILLS
    // =========================================================================
    const activityPanel = document.getElementById('activity-panel');
    const tabPlay = document.getElementById('tab-play');
    const tabGames = document.getElementById('tab-games');
    const tabCoping = document.getElementById('tab-coping');

    let currentTab = 'play';
    let breathInterval = null;
    let hideSeekTimer = null;

    const gameState = {
      activeGame: 'hide_seek', // 'hide_seek' | 'fetch' | 'routine'
      score: 0,
      streak: 0,
      targetPos: { x: 0.9, z: -0.4 },
      routineSequence: [],
      routineStepIndex: 0,
      routineShowing: false
    };

    const copingState = {
      activeSkill: 'breathing', // 'breathing' | 'music' | 'fidget' | 'space' | 'journal' | 'reading'
      breathStep: 'Inhale (4s)',
      musicMood: 'Calm',
      fidgetPops: [false, false, false, false, false, false, false, false, false],
      journalPrompts: [
        'One thing on my mind right now:',
        'How my body feels at this moment:',
        'Something small that went okay today:'
      ],
      selectedPromptIdx: 0,
      journalText: '',
      readingText: ''
    };

    function clearTimers() {
      if (breathInterval) {
        clearInterval(breathInterval);
        breathInterval = null;
      }
      if (hideSeekTimer) {
        clearTimeout(hideSeekTimer);
        hideSeekTimer = null;
      }
      dinoMotion.mode = 'idle';
      dinoPivot.scale.setScalar(1);
      fallbackImgEl.classList.remove('fallback-breathe-in', 'fallback-breathe-out', 'fallback-quiet');
      targetProp.visible = false;
      handleDinoTapCallback = null;
    }

    function setActiveTab(tabName) {
      clearTimers();
      currentTab = tabName;
      tabPlay.classList.toggle('active', tabName === 'play');
      tabGames.classList.toggle('active', tabName === 'games');
      tabCoping.classList.toggle('active', tabName === 'coping');
      renderActivityPanel();
    }

    // --- PLAY MODE ---
    function renderPlayPanel() {
      activityPanel.innerHTML = `
        <div class="panel-section">
          <div class="panel-title">Interactive Companion & Tasks</div>
          <p class="muted">
            Click or tap ${activeDino.name} in the stage to trigger a reaction, or send ${activeDino.name}
            to spots around the habitat.
          </p>
          <div class="btn-row">
            <button type="button" id="task-explore-btn">Explore Left</button>
            <button type="button" id="task-right-btn">Explore Right</button>
            <button type="button" id="task-patrol-btn">Do a Routine Loop</button>
          </div>
        </div>
        <div class="panel-section">
          <div class="panel-title">Switch Modes Anytime</div>
          <p class="muted">
            Jump into <strong>Mini-Games</strong> to play with your dino or <strong>Coping Skills</strong>
            for calm, low-pressure activities together.
          </p>
        </div>
      `;

      document.getElementById('task-explore-btn').addEventListener('click', () => {
        moveDinoTo(-1.1, -0.3, `${activeDino.name} is checking out the left side.`);
      });

      document.getElementById('task-right-btn').addEventListener('click', () => {
        moveDinoTo(1.1, -0.2, `${activeDino.name} is checking out the right side.`);
      });

      document.getElementById('task-patrol-btn').addEventListener('click', () => {
        setBanner(`${activeDino.name} is doing a mini routine!`);
        moveDinoTo(-0.9, 0.2);
        setTimeout(() => triggerHop(), 650);
        setTimeout(() => moveDinoTo(0.9, 0.2), 1150);
        setTimeout(() => triggerSpin(), 1800);
        setTimeout(() => centerDino(), 2300);
      });
    }

    // --- MINI-GAMES MODE ---
    function placeFetchTarget() {
      const rx = Number(((Math.random() * 2.2) - 1.1).toFixed(2));
      const rz = Number(((Math.random() * 1.6) - 0.9).toFixed(2));
      gameState.targetPos = { x: rx, z: rz };
      targetProp.position.set(rx, -0.7, rz);
      targetProp.visible = !usingFallback2D;
    }

    function scheduleHideSeekMove() {
      if (currentTab !== 'games' || gameState.activeGame !== 'hide_seek') return;
      const rx = (Math.random() * 2.6) - 1.3;
      const rz = (Math.random() * 1.8) - 1.0;
      moveDinoTo(rx, rz, `Hide & Seek: Tap ${activeDino.name}!`);
      hideSeekTimer = setTimeout(scheduleHideSeekMove, 2200);
    }

    function startRoutineRound() {
      const moves = ['hop', 'spin', 'left', 'right'];
      const len = Math.min(5, 2 + Math.floor(gameState.streak / 2));
      gameState.routineSequence = Array.from({ length: len }, () =>
        moves[Math.floor(Math.random() * moves.length)]
      );
      gameState.routineStepIndex = 0;
      gameState.routineShowing = true;
      setBanner(`Watch ${activeDino.name}'s routine...`);

      gameState.routineSequence.forEach((step, i) => {
        setTimeout(() => {
          if (currentTab !== 'games' || gameState.activeGame !== 'routine') return;
          if (step === 'hop') triggerHop(`Step ${i + 1}: Hop!`);
          else if (step === 'spin') triggerSpin(`Step ${i + 1}: Spin!`);
          else if (step === 'left') moveDinoTo(-1.0, 0, `Step ${i + 1}: Left!`);
          else if (step === 'right') moveDinoTo(1.0, 0, `Step ${i + 1}: Right!`);

          if (i === gameState.routineSequence.length - 1) {
            setTimeout(() => {
              centerDino();
              gameState.routineShowing = false;
              setBanner('Your turn! Repeat the routine.');
            }, 650);
          }
        }, i * 950);
      });
    }

    function handleRoutineInput(choice) {
      if (gameState.routineShowing || gameState.routineSequence.length === 0) return;
      const expected = gameState.routineSequence[gameState.routineStepIndex];
      if (choice === expected) {
        if (choice === 'hop') triggerHop();
        else if (choice === 'spin') triggerSpin();
        else if (choice === 'left') moveDinoTo(-1.0, 0);
        else if (choice === 'right') moveDinoTo(1.0, 0);

        gameState.routineStepIndex += 1;
        if (gameState.routineStepIndex >= gameState.routineSequence.length) {
          gameState.score += 10;
          gameState.streak += 1;
          onGameEvent('routine_complete', { score: gameState.score });
          setBanner(`Awesome! ${activeDino.name} nailed the routine (+10 pts)`);
          renderGamesPanel();
          setTimeout(() => {
            if (currentTab === 'games' && gameState.activeGame === 'routine') {
              startRoutineRound();
            }
          }, 1200);
        }
      } else {
        gameState.streak = 0;
        gameState.routineStepIndex = 0;
        onGameEvent('routine_retry');
        setBanner('Not quite—try the sequence from the start!');
        renderGamesPanel();
      }
    }

    function renderGamesPanel() {
      clearTimers();

      if (gameState.activeGame === 'hide_seek') {
        handleDinoTapCallback = () => {
          gameState.score += 5;
          gameState.streak += 1;
          onGameEvent('found_dino', { score: gameState.score });
          triggerHop(`Found ${activeDino.name}! (+5 pts)`);
          renderGamesPanel();
        };
        scheduleHideSeekMove();
      } else if (gameState.activeGame === 'fetch') {
        placeFetchTarget();
      }

      activityPanel.innerHTML = `
        <div class="panel-section">
          <div class="panel-title">Play Mini-Games With ${activeDino.name}</div>
          <div class="btn-row">
            <button type="button" id="g-hide" class="${gameState.activeGame === 'hide_seek' ? 'active' : ''}">Hide & Seek</button>
            <button type="button" id="g-fetch" class="${gameState.activeGame === 'fetch' ? 'active' : ''}">Fetch & Deliver</button>
            <button type="button" id="g-routine" class="${gameState.activeGame === 'routine' ? 'active' : ''}">Follow Routine</button>
          </div>
          <div class="stat-row">
            <span>Score: <strong>${gameState.score}</strong></span>
            <span>Streak: <strong>${gameState.streak}</strong></span>
          </div>
        </div>

        <div class="panel-section" id="game-mechanics-box"></div>
      `;

      document.getElementById('g-hide').addEventListener('click', () => {
        gameState.activeGame = 'hide_seek';
        renderGamesPanel();
      });

      document.getElementById('g-fetch').addEventListener('click', () => {
        gameState.activeGame = 'fetch';
        renderGamesPanel();
      });

      document.getElementById('g-routine').addEventListener('click', () => {
        gameState.activeGame = 'routine';
        renderGamesPanel();
        startRoutineRound();
      });

      const box = document.getElementById('game-mechanics-box');

      if (gameState.activeGame === 'hide_seek') {
        box.innerHTML = `
          <div class="panel-title">Hide & Seek</div>
          <p class="muted">
            ${activeDino.name} moves around the habitat. Click or tap ${activeDino.name} whenever you spot them!
          </p>
        `;
      } else if (gameState.activeGame === 'fetch') {
        box.innerHTML = `
          <div class="panel-title">Fetch & Deliver</div>
          <p class="muted">
            Send ${activeDino.name} to the golden target spot to collect it and score points.
          </p>
          <div class="btn-row">
            <button type="button" id="send-fetch-btn">Send ${activeDino.name} to Target</button>
            <button type="button" id="new-target-btn">New Target Spot</button>
          </div>
        `;

        document.getElementById('send-fetch-btn').addEventListener('click', () => {
          moveDinoTo(
            gameState.targetPos.x,
            gameState.targetPos.z,
            `${activeDino.name} is heading to the target...`
          );
          setTimeout(() => {
            if (currentTab !== 'games' || gameState.activeGame !== 'fetch') return;
            targetProp.visible = false;
            gameState.score += 10;
            gameState.streak += 1;
            onGameEvent('fetch_complete', { score: gameState.score });
            triggerSpin(`${activeDino.name} collected it! (+10 pts)`);
            renderGamesPanel();
          }, 950);
        });

        document.getElementById('new-target-btn').addEventListener('click', () => {
          placeFetchTarget();
          setBanner('Moved the target to a new spot!');
        });
      } else if (gameState.activeGame === 'routine') {
        const total = gameState.routineSequence.length;
        const step = gameState.routineStepIndex;
        box.innerHTML = `
          <div class="panel-title">Follow the Routine</div>
          <p class="muted">
            Watch ${activeDino.name}'s moves, then repeat them in order (${step}/${total} completed).
          </p>
          <div class="btn-row">
            <button type="button" id="r-hop">Hop</button>
            <button type="button" id="r-spin">Spin</button>
            <button type="button" id="r-left">Move Left</button>
            <button type="button" id="r-right">Move Right</button>
            <button type="button" id="r-replay">Replay Sequence</button>
          </div>
        `;

        document.getElementById('r-hop').addEventListener('click', () => handleRoutineInput('hop'));
        document.getElementById('r-spin').addEventListener('click', () => handleRoutineInput('spin'));
        document.getElementById('r-left').addEventListener('click', () => handleRoutineInput('left'));
        document.getElementById('r-right').addEventListener('click', () => handleRoutineInput('right'));
        document.getElementById('r-replay').addEventListener('click', () => startRoutineRound());
      }
    }

    // --- COPING SKILLS MODE ---
    function startBreathingGuide() {
      dinoMotion.mode = 'breathe';
      const phases = [
        { text: 'Breathe In Slowly...', cls: 'fallback-breathe-in' },
        { text: 'Hold Gently...', cls: 'fallback-breathe-in' },
        { text: 'Breathe Out Softly...', cls: 'fallback-breathe-out' }
      ];
      let idx = 0;

      const applyPhase = () => {
        const p = phases[idx % phases.length];
        copingState.breathStep = p.text;
        const cueEl = document.getElementById('breath-cue-text');
        if (cueEl) cueEl.textContent = p.text;
        setBanner(`${activeDino.name}: ${p.text}`);
        fallbackImgEl.classList.remove('fallback-breathe-in', 'fallback-breathe-out');
        if (usingFallback2D) fallbackImgEl.classList.add(p.cls);
        idx += 1;
      };

      applyPhase();
      breathInterval = setInterval(applyPhase, 4000);
    }

    function renderCopingPanel() {
      clearTimers();
      const skill = copingState.activeSkill;

      if (skill === 'breathing') {
        startBreathingGuide();
      } else if (skill === 'space') {
        dinoMotion.mode = 'quiet';
        moveDinoTo(-1.25, -0.75, `${activeDino.name} is resting quietly in the corner.`);
        if (usingFallback2D) fallbackImgEl.classList.add('fallback-quiet');
      }

      activityPanel.innerHTML = `
        <div class="panel-section">
          <div class="panel-title">Coping Skills With ${activeDino.name}</div>
          <div class="btn-row">
            <button type="button" data-skill="breathing" class="${skill === 'breathing' ? 'active' : ''}">Deep Breathing</button>
            <button type="button" data-skill="music" class="${skill === 'music' ? 'active' : ''}">Listen to Music</button>
            <button type="button" data-skill="fidget" class="${skill === 'fidget' ? 'active' : ''}">Fidget Toy</button>
            <button type="button" data-skill="space" class="${skill === 'space' ? 'active' : ''}">Taking Space</button>
            <button type="button" data-skill="journal" class="${skill === 'journal' ? 'active' : ''}">Journaling</button>
            <button type="button" data-skill="reading" class="${skill === 'reading' ? 'active' : ''}">Reading / Writing</button>
          </div>
        </div>

        <div class="panel-section" id="coping-body"></div>
      `;

      activityPanel.querySelectorAll('[data-skill]').forEach((btn) => {
        btn.addEventListener('click', () => {
          copingState.activeSkill = btn.getAttribute('data-skill');
          renderCopingPanel();
        });
      });

      const body = document.getElementById('coping-body');

      if (skill === 'breathing') {
        body.innerHTML = `
          <div class="breath-box">
            <div class="breath-cue" id="breath-cue-text">${copingState.breathStep}</div>
            <p class="muted">Watch ${activeDino.name} expand and soften at a steady, calm pace.</p>
          </div>
        `;
      } else if (skill === 'music') {
        body.innerHTML = `
          <div class="panel-title">Music & Rhythm Check-In</div>
          <p class="muted">
            Pick a mood while ${activeDino.name} keeps a gentle sway. Sound playback hooks are ready
            for your later audio pass.
          </p>
          <div class="btn-row">
            ${['Calm', 'Cozy', 'Focus'].map((m) => `
              <button type="button" class="mood-btn ${copingState.musicMood === m ? 'active' : ''}" data-mood="${m}">
                ${m} Vibe
              </button>
            `).join('')}
          </div>
        `;

        body.querySelectorAll('.mood-btn').forEach((b) => {
          b.addEventListener('click', () => {
            copingState.musicMood = b.getAttribute('data-mood');
            playDinoAudio('music_mood', { mood: copingState.musicMood });
            triggerSpin(`${activeDino.name} is vibing to ${copingState.musicMood} music.`);
            renderCopingPanel();
          });
        });
      } else if (skill === 'fidget') {
        body.innerHTML = `
          <div class="panel-title">Interactive Pop Fidget</div>
          <p class="muted">Pop bubbles as you go—${activeDino.name} gives a cheerful reaction each time.</p>
          <div class="fidget-grid">
            ${copingState.fidgetPops.map((popped, i) => `
              <button type="button" class="fidget-pop ${popped ? 'popped' : ''}" data-pop="${i}">
                ${popped ? '✓' : 'Pop'}
              </button>
            `).join('')}
          </div>
          <button type="button" id="reset-fidget-btn">Reset All Bubbles</button>
        `;

        body.querySelectorAll('.fidget-pop').forEach((btn) => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.getAttribute('data-pop'));
            copingState.fidgetPops[idx] = !copingState.fidgetPops[idx];
            triggerHop();
            renderCopingPanel();
          });
        });

        document.getElementById('reset-fidget-btn').addEventListener('click', () => {
          copingState.fidgetPops = copingState.fidgetPops.map(() => false);
          renderCopingPanel();
        });
      } else if (skill === 'space') {
        body.innerHTML = `
          <div class="panel-title">Taking Space</div>
          <p class="muted">
            No rush and no pressure. ${activeDino.name} has stepped back to a quiet corner so you can
            pause, rest, or take a breather at your own speed.
          </p>
          <button type="button" id="return-close-btn">Bring ${activeDino.name} Back When Ready</button>
        `;

        document.getElementById('return-close-btn').addEventListener('click', () => {
          fallbackImgEl.classList.remove('fallback-quiet');
          centerDino();
        });
      } else if (skill === 'journal') {
        body.innerHTML = `
          <div class="panel-title">Quick Journal With ${activeDino.name}</div>
          <div class="btn-row">
            ${copingState.journalPrompts.map((p, i) => `
              <button type="button" class="prompt-chip ${copingState.selectedPromptIdx === i ? 'active' : ''}" data-p="${i}">
                Prompt ${i + 1}
              </button>
            `).join('')}
          </div>
          <p class="muted">${copingState.journalPrompts[copingState.selectedPromptIdx]}</p>
          <textarea id="journal-area" placeholder="Write whatever is on your mind...">${copingState.journalText}</textarea>
        `;

        body.querySelectorAll('.prompt-chip').forEach((btn) => {
          btn.addEventListener('click', () => {
            copingState.selectedPromptIdx = Number(btn.getAttribute('data-p'));
            renderCopingPanel();
          });
        });

        document.getElementById('journal-area').addEventListener('input', (e) => {
          copingState.journalText = e.target.value;
        });
      } else if (skill === 'reading') {
        body.innerHTML = `
          <div class="panel-title">Reading & Writing Companion</div>
          <p class="muted">
            ${activeDino.name} is hanging out nearby as a calm study or reading buddy. Jot notes,
            draft a story, or read through something you're working on.
          </p>
          <textarea id="reading-area" placeholder="Type notes, story lines, or reading thoughts here...">${copingState.readingText}</textarea>
        `;

        document.getElementById('reading-area').addEventListener('input', (e) => {
          copingState.readingText = e.target.value;
        });
      }
    }

    function renderActivityPanel() {
      if (currentTab === 'play') renderPlayPanel();
      else if (currentTab === 'games') renderGamesPanel();
      else if (currentTab === 'coping') renderCopingPanel();
    }

    // =========================================================================
    // 6. DROPDOWNS, TOP BUTTONS & ANIMATION LOOP
    // =========================================================================
    const standardSelect = document.getElementById('standard-select');
    const holidaySelect = document.getElementById('holiday-select');

    STANDARD_DINOS.forEach((dino, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = dino.title;
      standardSelect.appendChild(opt);
    });

    HOLIDAY_DINOS.forEach((hol, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = hol.label;
      holidaySelect.appendChild(opt);
    });

    standardSelect.addEventListener('change', (e) => {
      loadDino(STANDARD_DINOS[Number(e.target.value)]);
    });

    holidaySelect.addEventListener('change', (e) => {
      loadDino(HOLIDAY_DINOS[Number(e.target.value)]);
    });

    document.getElementById('random-dino-btn').addEventListener('click', () => {
      const pick = ALL_DINOS[Math.floor(Math.random() * ALL_DINOS.length)];
      loadDino(pick);
    });

    document.getElementById('hop-btn').addEventListener('click', () => triggerHop());
    document.getElementById('spin-btn').addEventListener('click', () => triggerSpin());
    document.getElementById('center-btn').addEventListener('click', () => centerDino());
    document.getElementById('reset-cam-btn').addEventListener('click', () => resetCamera());

    tabPlay.addEventListener('click', () => setActiveTab('play'));
    tabGames.addEventListener('click', () => setActiveTab('games'));
    tabCoping.addEventListener('click', () => setActiveTab('coping'));

    window.addEventListener('resize', () => {
      const w = stageEl.clientWidth;
      const h = Math.max(stageEl.clientHeight, 1);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (targetProp.visible) {
        targetProp.rotation.y += dt * 2.2;
      }

      if (!usingFallback2D && currentModelMesh) {
        if (dinoMotion.mode === 'moveTo') {
          const toTarget = new THREE.Vector3(
            dinoMotion.targetPos.x - dinoPivot.position.x,
            0,
            dinoMotion.targetPos.z - dinoPivot.position.z
          );
          const dist = toTarget.length();
          if (dist > 0.04) {
            toTarget.normalize();
            dinoPivot.position.x += toTarget.x * dt * 2.1;
            dinoPivot.position.z += toTarget.z * dt * 2.1;
            dinoPivot.position.y = Math.abs(Math.sin(clock.elapsedTime * 7)) * 0.08;
            const desiredAngle = Math.atan2(toTarget.x, toTarget.z);
            dinoPivot.rotation.y = desiredAngle;
          } else {
            dinoPivot.position.x = dinoMotion.targetPos.x;
            dinoPivot.position.z = dinoMotion.targetPos.z;
            dinoPivot.position.y = 0;
            dinoMotion.mode = 'idle';
          }
        } else if (dinoMotion.mode === 'hop') {
          dinoMotion.hopTimer -= dt;
          if (dinoMotion.hopTimer > 0) {
            const progress = 1 - dinoMotion.hopTimer / 0.45;
            dinoPivot.position.y = Math.sin(progress * Math.PI) * 0.45;
          } else {
            dinoPivot.position.y = 0;
            dinoMotion.mode = 'idle';
          }
        } else if (dinoMotion.mode === 'spin') {
          const step = Math.min(dinoMotion.spinRemaining, dt * 8.5);
          dinoPivot.rotation.y += step;
          dinoMotion.spinRemaining -= step;
          if (dinoMotion.spinRemaining <= 0.001) {
            dinoMotion.mode = 'idle';
          }
        } else if (dinoMotion.mode === 'breathe') {
          dinoMotion.breathPhase += dt * 0.785; // ~8s cycle across inhale/hold/exhale
          const s = 1 + Math.sin(dinoMotion.breathPhase) * 0.1;
          dinoPivot.scale.setScalar(s);
        } else if (dinoMotion.mode === 'quiet') {
          dinoPivot.position.y = Math.sin(clock.elapsedTime * 1.2) * 0.02;
          dinoPivot.scale.setScalar(0.95);
        } else {
          // Gentle idle sway
          dinoPivot.position.y = Math.sin(clock.elapsedTime * 2.0) * 0.03;
          dinoPivot.scale.setScalar(1);
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
    renderActivityPanel();
    loadDino(STANDARD_DINOS[0]);
  </script>
</body>
</html>
