<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>DinoNest Labs — AdaptedMind 2D Learning Adventure</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./assets/chibi/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap');

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(180deg, #e0f2fe 0%, #f8fafc 45%, #fef9c3 100%);
      min-height: 100vh;
      color: #1e293b;
    }

    h1, h2, h3, .font-display {
      font-family: 'Fredoka', sans-serif;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes happyHop {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-16px) scale(1.06); }
      65% { transform: translateY(-5px) scale(1.03); }
    }

    @keyframes nudgeTilt {
      0%, 100% { transform: rotate(0deg); }
      35% { transform: rotate(-6deg); }
      70% { transform: rotate(6deg); }
    }

    .anim-float { animation: gentleFloat 3s ease-in-out infinite; }
    .anim-hop { animation: happyHop 0.8s ease-in-out 2; }
    .anim-tilt { animation: nudgeTilt 0.65s ease-in-out 2; }
  </style>
</head>
<body class="antialiased">
  <div id="app" class="max-w-6xl mx-auto px-4 py-4 md:py-6"></div>

  <script>
    // =========================================================================
    // 1. 2D ASSET CATALOG ONLY (PNG & JPG — ZERO 3D / GLB)
    // =========================================================================
    const BRAND_LOGO = './assets/chibi/logo.png';

    const DINO_ROSTER = [
      { id: 'image_0',  name: 'Pip',    role: 'Math Sprout',       specialty: 'Addition & Counting',   cost: 0,   img: './assets/chibi/image_0.png' },
      { id: 'image_1',  name: 'Trixie', role: 'Horned Thinker',    specialty: 'Logic & Subtraction',   cost: 0,   img: './assets/chibi/image_1.png' },
      { id: 'image_2',  name: 'Bram',   role: 'Tall Reader',       specialty: 'Word Meanings',         cost: 25,  img: './assets/chibi/image_2.png' },
      { id: 'image_3',  name: 'Sunny',  role: 'Plate Builder',     specialty: 'Number Patterns',       cost: 50,  img: './assets/chibi/image_3.png' },
      { id: 'image_4',  name: 'Pia',    role: 'Sky Scout',         specialty: 'Reading Clues',         cost: 75,  img: './assets/chibi/image_4.png' },
      { id: 'image_5',  name: 'Anky',   role: 'Armored Guard',     specialty: 'Fact Fluency',          cost: 100, img: './assets/chibi/image_5.png' },
      { id: 'image_6',  name: 'Pari',   role: 'Crest Singer',      specialty: 'Grammar & Verbs',       cost: 130, img: './assets/chibi/image_6.png' },
      { id: 'image_7',  name: 'Veloci', role: 'Swift Solver',      specialty: 'Speed Math',            cost: 160, img: './assets/chibi/image_7.png' },
      { id: 'image_8',  name: 'Plesio', role: 'Deep Diver',        specialty: 'Science Facts',         cost: 200, img: './assets/chibi/image_8.png' },
      { id: 'image_9',  name: 'Spike',  role: 'Sail Researcher',   specialty: 'Earth & Fossils',       cost: 240, img: './assets/chibi/image_9.png' },
      { id: 'image_10', name: 'Dippy',  role: 'Long-Tail Scholar', specialty: 'Fractions & Ratios',    cost: 290, img: './assets/chibi/image_10.png' },
      { id: 'image_11', name: 'Pachy',  role: 'Dome Striker',      specialty: 'Big Brain Challenges',  cost: 340, img: './assets/chibi/image_11.png' },
      { id: 'image_12', name: 'Astra',  role: 'Starlight Guide',   specialty: 'Birthday Unlock',       cost: 500, isBirthday: true, img: './assets/chibi/image_12.png' }
    ];

    const HOLIDAY_CARDS = [
      { key: '',               title: 'Standard Chibi',    img: '' },
      { key: 'new_years',      title: "New Year's",        img: './assets/chibi/holidays/new_years.jpg' },
      { key: 'mlk_day',        title: 'MLK Day',           img: './assets/chibi/holidays/mlk_day.jpg' },
      { key: 'presidents_day', title: "Presidents' Day",   img: './assets/chibi/holidays/presidents_day.jpg' },
      { key: 'st_patricks',    title: "St. Patrick's Day", img: './assets/chibi/holidays/st_patricks.jpg' },
      { key: 'easter',         title: 'Easter',            img: './assets/chibi/holidays/easter.jpg' },
      { key: 'memorial_day',   title: 'Memorial Day',      img: './assets/chibi/holidays/memorial_day.jpg' },
      { key: 'juneteenth',     title: 'Juneteenth',        img: './assets/chibi/holidays/juneteenth.jpg' },
      { key: 'july_4th',       title: 'July 4th',          img: './assets/chibi/holidays/july_4th.jpg' },
      { key: 'labor_day',      title: 'Labor Day',         img: './assets/chibi/holidays/labor_day.jpg' },
      { key: 'halloween',      title: 'Halloween',         img: './assets/chibi/holidays/halloween.jpg' },
      { key: 'thanksgiving',   title: 'Thanksgiving',      img: './assets/chibi/holidays/thanksgiving.jpg' },
      { key: 'christmas',      title: 'Christmas',         img: './assets/chibi/holidays/christmas.jpg' },
      { key: 'valentines',     title: "Valentine's Day",   img: './assets/chibi/holidays/valentines.jpg' }
    ];

    const SUBJECTS = [
      { id: 'math',    title: 'Math',    badge: '➕', note: 'Arithmetic, patterns, fractions & algebra' },
      { id: 'reading', title: 'Reading', badge: '📖', note: 'Vocabulary, context clues, grammar & roots' },
      { id: 'science', title: 'Science', badge: '🔬', note: 'Dinosaurs, fossils, habitats & space' }
    ];

    const TIERS = ['Foundations', 'Steady Pace', 'Stretch', 'Challenge'];

    // =========================================================================
    // 2. SAVED LEARNER STATE
    // =========================================================================
    const STORE_KEY = 'dinonest_adaptedmind_2d_only';

    const initialState = {
      name: 'Learner',
      bdayMonth: '',
      bdayDay: '',
      grade: 2,
      subject: 'math',
      view: 'lesson', // 'lesson' | 'wardrobe' | 'games' | 'stats'
      buddyId: 'image_0',
      holidayKey: '',
      unlocked: ['image_0', 'image_1'],
      stars: 30,
      xp: 0,
      streak: 0,
      bestStreak: 0,
      tierIndex: 0,
      totalAnswered: 0,
      totalCorrect: 0,
      bySubject: {
        math: { answered: 0, correct: 0 },
        reading: { answered: 0, correct: 0 },
        science: { answered: 0, correct: 0 }
      }
    };

    function loadSavedState() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return structuredClone(initialState);
        const data = JSON.parse(raw);
        return {
          ...structuredClone(initialState),
          ...data,
          bySubject: {
            ...structuredClone(initialState.bySubject),
            ...(data.bySubject || {})
          }
        };
      } catch {
        return structuredClone(initialState);
      }
    }

    let appState = loadSavedState();

    function persistState() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(appState));
      } catch {}
    }

    function applyBirthdayUnlock() {
      if (!appState.bdayMonth || !appState.bdayDay) return;
      const now = new Date();
      const matchesToday =
        (now.getMonth() + 1) === Number(appState.bdayMonth) &&
        now.getDate() === Number(appState.bdayDay);
      if (matchesToday && !appState.unlocked.includes('image_12')) {
        appState.unlocked.push('image_12');
        appState.buddyId = 'image_12';
        appState.holidayKey = '';
        persistState();
      }
    }

    // Transient UI & mini-game state
    let question = null;
    let pickedChoice = null;
    let outcome = null; // null | 'right' | 'wrong'
    let showGuide = false;
    let buddyAnim = 'anim-float';
    let statusBanner = 'Pick an answer to earn Stars and grow your streak.';

    let arcadeMode = 'match'; // 'match' | 'quiz'
    let cards = [];
    let flipped = [];
    let matchedCount = 0;
    let moveCount = 0;
    let boardLocked = false;

    let quickPoints = 0;
    let quickSeconds = 25;
    let quickActive = false;
    let quickItem = null;
    let quickTimer = null;

    // =========================================================================
    // 3. ADAPTED-MIND STYLE QUESTION GENERATOR
    // =========================================================================
    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pickRandom(list) {
      return list[rand(0, list.length - 1)];
    }

    function shuffleList(list) {
      const arr = [...list];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = rand(0, i);
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildNumberOptions(answer, span = 6) {
      const options = new Set([answer]);
      let tries = 0;
      while (options.size < 4 && tries < 50) {
        tries++;
        const candidate = answer + rand(-span, span);
        if (candidate >= 0 && candidate !== answer) {
          options.add(candidate);
        }
      }
      while (options.size < 4) {
        options.add(answer + options.size + 2);
      }
      return shuffleList([...options].map(String));
    }

    function makeMathItem(grade, tier) {
      const boost = grade + tier;
      if (grade <= 2) {
        const kind = rand(1, 3);
        if (kind === 1) {
          const a = rand(2, 10 + boost * 3);
          const b = rand(2, 9 + boost * 2);
          const ans = a + b;
          return {
            topic: `Grade ${grade} • Addition`,
            text: `Add the two numbers together:`,
            display: `${a} + ${b} = ?`,
            options: buildNumberOptions(ans, 5),
            answer: String(ans),
            hint: `Count ${b} steps forward starting from ${a}.`,
            steps: `Start at ${a} and add ${b} to get ${ans}.`
          };
        }
        if (kind === 2) {
          const whole = rand(10, 18 + boost * 3);
          const part = rand(2, whole - 2);
          const ans = whole - part;
          return {
            topic: `Grade ${grade} • Subtraction`,
            text: `Find the missing difference:`,
            display: `${whole} − ${part} = ?`,
            options: buildNumberOptions(ans, 5),
            answer: String(ans),
            hint: `Take away ${part} from ${whole}.`,
            steps: `${whole} minus ${part} equals ${ans}.`
          };
        }
        const step = rand(2, 5);
        const start = rand(1, 4) * step;
        const ans = start + step * 3;
        return {
          topic: `Grade ${grade} • Skip Counting`,
          text: `What number completes the sequence?`,
          display: `${start}, ${start + step}, ${start + step * 2}, ?`,
          options: buildNumberOptions(ans, step * 2),
          answer: String(ans),
          hint: `Each number increases by ${step}.`,
          steps: `Add ${step} to ${start + step * 2} to get ${ans}.`
        };
      }

      if (grade <= 4) {
        const kind = rand(1, 3);
        if (kind === 1) {
          const a = rand(2, 8 + tier * 2);
          const b = rand(3, 9 + tier);
          const ans = a * b;
          return {
            topic: `Grade ${grade} • Multiplication`,
            text: `Multiply the factors:`,
            display: `${a} × ${b} = ?`,
            options: buildNumberOptions(ans, 10),
            answer: String(ans),
            hint: `Think of ${a} groups of ${b}.`,
            steps: `${a} × ${b} = ${ans}.`
          };
        }
        if (kind === 2) {
          const divisor = rand(2, 7 + tier);
          const quotient = rand(3, 9 + tier);
          const dividend = divisor * quotient;
          return {
            topic: `Grade ${grade} • Division`,
            text: `Divide evenly:`,
            display: `${dividend} ÷ ${divisor} = ?`,
            options: buildNumberOptions(quotient, 4),
            answer: String(quotient),
            hint: `Which number times ${divisor} equals ${dividend}?`,
            steps: `${divisor} × ${quotient} = ${dividend}, so ${dividend} ÷ ${divisor} = ${quotient}.`
          };
        }
        const denom = pickRandom([4, 5, 6, 8]);
        const n1 = rand(1, denom - 2);
        const n2 = rand(1, denom - n1);
        const ans = `${n1 + n2}/${denom}`;
        return {
          topic: `Grade ${grade} • Fractions`,
          text: `Add the fractions with like denominators:`,
          display: `${n1}/${denom} + ${n2}/${denom} = ?`,
          options: shuffleList([...new Set([
            ans,
            `${n1 + n2}/${denom * 2}`,
            `${Math.max(1, n1 + n2 - 1)}/${denom}`,
            `${n1 + n2 + 1}/${denom}`
          ])]),
          answer: ans,
          hint: `Add the numerators (${n1} + ${n2}) and keep ${denom} on the bottom.`,
          steps: `${n1} + ${n2} = ${n1 + n2}, giving ${ans}.`
        };
      }

      // Grades 5–6
      const kind = rand(1, 3);
      if (kind === 1) {
        const a = rand(5, 14 + tier * 2);
        const b = rand(3, 10 + tier);
        const c = rand(4, 20);
        const ans = a * b + c;
        return {
          topic: `Grade ${grade} • Order of Operations`,
          text: `Solve using order of operations:`,
          display: `${a} × ${b} + ${c} = ?`,
          options: buildNumberOptions(ans, 12),
          answer: String(ans),
          hint: `Do multiplication (${a} × ${b}) before adding ${c}.`,
          steps: `${a} × ${b} = ${a * b}, then ${a * b} + ${c} = ${ans}.`
        };
      }
      if (kind === 2) {
        const pct = pickRandom([10, 20, 25, 50]);
        const base = pct === 25 ? rand(2, 10) * 4 : rand(2, 12) * 10;
        const ans = (pct / 100) * base;
        return {
          topic: `Grade ${grade} • Percentages`,
          text: `Calculate the percentage of the number:`,
          display: `${pct}% of ${base} = ?`,
          options: buildNumberOptions(ans, 8),
          answer: String(ans),
          hint: `Find ${pct}/100 of ${base}.`,
          steps: `(${pct} ÷ 100) × ${base} = ${ans}.`
        };
      }
      const x = rand(2, 12 + tier);
      const m = rand(2, 5);
      const k = rand(2, 12);
      const total = m * x + k;
      return {
        topic: `Grade ${grade} • Equations`,
        text: `Find the value of x:`,
        display: `${m}x + ${k} = ${total}`,
        options: buildNumberOptions(x, 4),
        answer: String(x),
        hint: `Subtract ${k} from ${total}, then divide by ${m}.`,
        steps: `${total} − ${k} = ${total - k}, and ${total - k} ÷ ${m} = ${x}.`
      };
    }

    const READING_ITEMS = [
      { minG: 1, maxG: 3, topic: 'Vocabulary', text: 'Which word means almost the same as "tiny"?', display: 'Synonym: TINY', options: ['Small', 'Giant', 'Heavy', 'Loud'], answer: 'Small', hint: 'Look for a word that means very little in size.', steps: '"Small" has a meaning close to "tiny".' },
      { minG: 1, maxG: 3, topic: 'Opposites', text: 'Which word is the opposite of "above"?', display: 'Antonym: ABOVE', options: ['Below', 'Over', 'High', 'Top'], answer: 'Below', hint: 'If something is over your head, the opposite is under it.', steps: '"Below" means lower than or under, which is opposite to "above".' },
      { minG: 1, maxG: 3, topic: 'Parts of Speech', text: 'Which word is a noun in: "The dino jumped over a log"?', display: '"The dino jumped over a log"', options: ['log', 'jumped', 'over', 'quickly'], answer: 'log', hint: 'A noun names a person, place, or thing.', steps: '"Log" names a physical object, so it is a noun.' },
      { minG: 1, maxG: 3, topic: 'Context Clues', text: '"Bram was famished after walking all morning, so he ate a huge lunch." What does famished mean?', display: 'Context: FAMISHED', options: ['Very hungry', 'Very sleepy', 'Very neat', 'Very quiet'], answer: 'Very hungry', hint: 'Eating a huge lunch is a clue for how Bram felt.', steps: 'Eating a large meal after a long morning shows Bram was very hungry.' },
      { minG: 4, maxG: 6, topic: 'Context Clues', text: '"Pia gave a concise answer using only ten clear words." What does concise mean?', display: 'Context: CONCISE', options: ['Short and clear', 'Confusing and long', 'Angry and loud', 'Funny and silly'], answer: 'Short and clear', hint: 'Notice that Pia used only ten clear words.', steps: 'Concise means giving a lot of information clearly and in few words.' },
      { minG: 4, maxG: 6, topic: 'Word Roots', text: 'The root "bio" relates to life. What does "biology" study?', display: 'Root: BIO-', options: ['Living things', 'Mountains and valleys', 'Stars and planets', 'Ancient coins'], answer: 'Living things', hint: 'Connect "bio" (life) with "-ology" (study of).', steps: 'Biology is the scientific study of living organisms.' },
      { minG: 4, maxG: 6, topic: 'Figurative Language', text: '"The wind whispered secrets through the tall pines." This is an example of:', display: '"wind whispered secrets"', options: ['Personification', 'Multiplication', 'Division', 'Fact table'], answer: 'Personification', hint: 'Whispering secrets is a human action given to the wind.', steps: 'Giving human traits like whispering to non-human wind is personification.' },
      { minG: 4, maxG: 6, topic: 'Grammar', text: 'Choose the best word: "Neither the leaves nor the branch _____ moving."', display: 'Subject-Verb Agreement', options: ['was', 'were', 'are', 'be'], answer: 'was', hint: 'Look at the closer singular subject ("branch").', steps: 'With "neither... nor" and singular "branch", "was" is the matching singular verb.' }
    ];

    const SCIENCE_ITEMS = [
      { minG: 1, maxG: 3, topic: 'Fossils', text: 'Where do scientists usually find dinosaur fossils?', display: 'Earth & Fossils', options: ['Sedimentary rock layers', 'Inside clouds', 'On the Moon', 'Inside boiling water'], answer: 'Sedimentary rock layers', hint: 'Sediment builds up over long periods of time.', steps: 'Fossils form when remains are buried under layers of sediment that turn to rock.' },
      { minG: 1, maxG: 3, topic: 'Animal Diets', text: 'An animal that eats both plants and other animals is called an:', display: 'Food Chains', options: ['Omnivore', 'Herbivore', 'Mineral', 'Planet'], answer: 'Omnivore', hint: 'Omni means "all".', steps: 'Omnivores eat both plant and animal foods.' },
      { minG: 1, maxG: 3, topic: 'Weather & Water', text: 'When water warms up and turns into water vapor, that process is called:', display: 'Water Cycle', options: ['Evaporation', 'Freezing', 'Erosion', 'Orbiting'], answer: 'Evaporation', hint: 'Think of puddles drying up on a sunny day.', steps: 'Evaporation happens when liquid water changes into gas (water vapor).' },
      { minG: 1, maxG: 3, topic: 'Space', text: 'Which planet do we live on?', display: 'Our Solar System', options: ['Earth', 'Saturn', 'Neptune', 'Mercury'], answer: 'Earth', hint: 'It is the third planet from the Sun.', steps: 'Earth is our home planet in the solar system.' },
      { minG: 4, maxG: 6, topic: 'Earth Science', text: 'What slowly moves Earth’s tectonic plates over millions of years?', display: 'Plate Tectonics', options: ['Convection in the mantle', ' Ocean tides alone', 'Solar eclipses', ' Wind gusts'], answer: 'Convection in the mantle', hint: 'Heat from Earth’s interior creates slow currents in the mantle.', steps: 'Heat-driven convection currents in the mantle push and move tectonic plates.' },
      { minG: 4, maxG: 6, topic: 'Ecology', text: 'In an ecosystem, organisms like fungi and bacteria that break down dead matter are:', display: 'Ecosystem Roles', options: ['Decomposers', 'Producers', 'Asteroids', 'Satellites'], answer: 'Decomposers', hint: 'They recycle nutrients back into the soil.', steps: 'Decomposers break down dead organic material and return nutrients to the environment.' },
      { minG: 4, maxG: 6, topic: 'Energy', text: 'A flashlight uses chemical energy from a battery and converts it mainly into:', display: 'Energy Transformation', options: ['Light and thermal energy', 'Sound and gravity', 'Fossils and rock', ' Magnetism only'], answer: 'Light and thermal energy', hint: 'A flashlight gives off light and a little warmth.', steps: 'Batteries supply electrical/chemical energy that the bulb turns into light and heat.' },
      { minG: 4, maxG: 6, topic: 'Astronomy', text: 'Why does the Moon appear to change shape over a month?', display: 'Phases of the Moon', options: ['We see different lit portions from Earth', 'The Moon shrinks and grows', 'Clouds cover half the Moon', 'Earth blocks it every night'], answer: 'We see different lit portions from Earth', hint: 'Half of the Moon is always lit by the Sun.', steps: 'As the Moon orbits Earth, we see varying angles of its sunlit side.' }
    ];

    function generateNextQuestion() {
      if (appState.subject === 'math') {
        return makeMathItem(appState.grade, appState.tierIndex);
      }
      const source = appState.subject === 'reading' ? READING_ITEMS : SCIENCE_ITEMS;
      const matching = source.filter(item => appState.grade >= item.minG && appState.grade <= item.maxG);
      const chosen = pickRandom(matching.length ? matching : source);
      return {
        ...chosen,
        options: shuffleList(chosen.options)
      };
    }

    function advanceQuestion() {
      question = generateNextQuestion();
      pickedChoice = null;
      outcome = null;
      showGuide = false;
      buddyAnim = 'anim-float';
      renderApp();
    }

    // =========================================================================
    // 4. 2D IMAGE HELPERS (PNG & JPG ONLY)
    // =========================================================================
    function currentDino() {
      return DINO_ROSTER.find(d => d.id === appState.buddyId) || DINO_ROSTER[0];
    }

    function currentDisplayImage() {
      const holiday = HOLIDAY_CARDS.find(h => h.key === appState.holidayKey);
      if (holiday && holiday.img) {
        return holiday.img;
      }
      return currentDino().img;
    }

    function currentHolidayLabel() {
      const holiday = HOLIDAY_CARDS.find(h => h.key === appState.holidayKey);
      return holiday && holiday.key ? holiday.title : 'Standard Chibi';
    }

    // =========================================================================
    // 5. INTERACTIONS
    // =========================================================================
    function answerQuestion(option) {
      if (outcome !== null) return;
      pickedChoice = option;
      appState.totalAnswered += 1;
      appState.bySubject[appState.subject].answered += 1;

      if (option === question.answer) {
        outcome = 'right';
        buddyAnim = 'anim-hop';
        appState.totalCorrect += 1;
        appState.bySubject[appState.subject].correct += 1;
        appState.streak += 1;
        appState.bestStreak = Math.max(appState.bestStreak, appState.streak);

        const streakBonus = appState.streak >= 3 ? 5 : 0;
        const gainedStars = 5 + streakBonus;
        appState.stars += gainedStars;
        appState.xp += 15 + appState.tierIndex * 5;

        if (appState.streak % 3 === 0 && appState.tierIndex < TIERS.length - 1) {
          appState.tierIndex += 1;
          statusBanner = `Correct! Moved up to ${TIERS[appState.tierIndex]} (+${gainedStars} Stars).`;
        } else {
          statusBanner = `Correct! Earned +${gainedStars} Stars${streakBonus ? ' (includes streak bonus)' : ''}.`;
        }
      } else {
        outcome = 'wrong';
        buddyAnim = 'anim-tilt';
        showGuide = true;
        appState.streak = 0;
        if (appState.tierIndex > 0) {
          appState.tierIndex -= 1;
        }
        statusBanner = 'Not quite—check the step-by-step guide below and try the next one.';
      }

      persistState();
      renderApp();
    }

    function changeGrade(g) {
      appState.grade = g;
      persistState();
      advanceQuestion();
    }

    function changeSubject(subj) {
      appState.subject = subj;
      persistState();
      advanceQuestion();
    }

    function changeView(v) {
      if (quickTimer && v !== 'games') {
        endQuickQuiz(false);
      }
      appState.view = v;
      if (v === 'games' && cards.length === 0) {
        setupMatchCards();
      }
      persistState();
      renderApp();
    }

    function chooseDino(id) {
      if (!appState.unlocked.includes(id)) return;
      appState.buddyId = id;
      appState.holidayKey = '';
      buddyAnim = 'anim-hop';
      persistState();
      renderApp();
    }

    function buyDino(id) {
      const target = DINO_ROSTER.find(d => d.id === id);
      if (!target || appState.unlocked.includes(id) || appState.stars < target.cost) return;
      appState.stars -= target.cost;
      appState.unlocked.push(id);
      appState.buddyId = id;
      appState.holidayKey = '';
      buddyAnim = 'anim-hop';
      statusBanner = `Unlocked ${target.name} (${target.role})!`;
      persistState();
      renderApp();
    }

    function chooseHoliday(key) {
      appState.holidayKey = key;
      buddyAnim = 'anim-hop';
      persistState();
      renderApp();
    }

    function saveLearnerField(key, val) {
      appState[key] = val;
      applyBirthdayUnlock();
      persistState();
      renderApp();
    }

    // =========================================================================
    // 6. 2D ARCADE GAMES (PNG & JPG ONLY)
    // =========================================================================
    function setupMatchCards() {
      const selected = shuffleList(DINO_ROSTER).slice(0, 6);
      cards = shuffleList([...selected, ...selected]).map((dino, index) => ({
        index,
        id: dino.id,
        name: dino.name,
        img: dino.img,
        matched: false
      }));
      flipped = [];
      matchedCount = 0;
      moveCount = 0;
      boardLocked = false;
    }

    function selectMatchCard(idx) {
      if (boardLocked) return;
      const card = cards[idx];
      if (!card || card.matched || flipped.includes(idx)) return;

      flipped.push(idx);
      renderApp();

      if (flipped.length === 2) {
        moveCount += 1;
        boardLocked = true;
        const [a, b] = flipped;
        if (cards[a].id === cards[b].id) {
          setTimeout(() => {
            cards[a].matched = true;
            cards[b].matched = true;
            flipped = [];
            matchedCount += 1;
            boardLocked = false;
            if (matchedCount === 6) {
              appState.stars += 15;
              appState.xp += 25;
              persistState();
            }
            renderApp();
          }, 400);
        } else {
          setTimeout(() => {
            flipped = [];
            boardLocked = false;
            renderApp();
          }, 700);
        }
      }
    }

    function makeQuickPrompt() {
      const limit = appState.grade * 5 + 5;
      const x = rand(1, limit);
      const y = rand(1, limit);
      const plus = Math.random() >= 0.4 || x < y;
      const ans = plus ? x + y : x - y;
      return {
        label: plus ? `${x} + ${y}` : `${x} − ${y}`,
        answer: String(ans),
        options: buildNumberOptions(ans, 4)
      };
    }

    function startQuickQuiz() {
      endQuickQuiz(false);
      quickPoints = 0;
      quickSeconds = 25;
      quickActive = true;
      quickItem = makeQuickPrompt();
      renderApp();

      quickTimer = setInterval(() => {
        quickSeconds -= 1;
        if (quickSeconds <= 0) {
          endQuickQuiz(true);
        } else {
          renderApp();
        }
      }, 1000);
    }

    function endQuickQuiz(awardStars) {
      if (quickTimer) {
        clearInterval(quickTimer);
        quickTimer = null;
      }
      if (awardStars && quickActive && quickPoints > 0) {
        appState.stars += quickPoints * 2;
        appState.xp += quickPoints * 5;
        persistState();
      }
      quickActive = false;
      renderApp();
    }

    function answerQuickQuiz(opt) {
      if (!quickActive || !quickItem) return;
      if (opt === quickItem.answer) {
        quickPoints += 1;
      }
      quickItem = makeQuickPrompt();
      renderApp();
    }

                Set your birthday month and day to automatically unlock Astra on your birthday.
              </p>

              <div class="space-y-3">
                <div>
                  <label class="block text-xs font-extrabold text-slate-600 mb-1">Name</label>
                  <input
                    type="text"
                    value="${appState.name}"
                    onchange="saveLearnerField('name', this.value)"
                    class="w-full px-3.5 py-2.5 rounded-2xl border border-slate-300 font-bold text-sm"
                  />
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-extrabold text-slate-600 mb-1">Month (1–12)</label>
                    <input
                      type="number"
                      min="1"
                      max="12"
                      value="${appState.bdayMonth}"
                      onchange="saveLearnerField('bdayMonth', this.value)"
                      class="w-full px-3.5 py-2.5 rounded-2xl border border-slate-300 font-bold text-sm"
                    />
                  </div>
                  <div>
                    <label class="block text-xs font-extrabold text-slate-600 mb-1">Day (1–31)</label>
                    <input
                      type="number"
                      min="1"
                      max="31"
                      value="${appState.bdayDay}"
                      onchange="saveLearnerField('bdayDay', this.value)"
                      class="w-full px-3.5 py-2.5 rounded-2xl border border-slate-300 font-bold text-sm"
                    />
                  </div>
                </div>
              </div>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-100 flex items-center gap-3">
              <img src="./assets/chibi/image_12.png" alt="Astra" class="w-12 h-12 rounded-xl object-contain bg-fuchsia-50 p-1" />
              <div class="text-xs font-bold text-slate-600">
                Astra: <span class="font-extrabold ${hasAstra ? 'text-emerald-700' : 'text-fuchsia-700'}">
                  ${hasAstra ? 'Unlocked' : 'Locked until birthday or 500 Stars'}
                </span>
              </div>
            </div>
          </section>
        </div>
      `;
    }

    function renderApp() {
      applyBirthdayUnlock();
      const mount = document.getElementById('app');
      let viewHtml = '';
      if (appState.view === 'lesson') viewHtml = renderLessonView();
      else if (appState.view === 'wardrobe') viewHtml = renderWardrobeView();
      else if (appState.view === 'games') viewHtml = renderGamesView();
      else viewHtml = renderStatsView();

      mount.innerHTML = `${renderHeader()}<main>${viewHtml}</main>`;
    }

    renderApp();
  </script>
</body>
</html>
