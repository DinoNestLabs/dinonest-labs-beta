  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap');

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(180deg, #e0f2fe 0%, #f8fafc 45%, #fef9c3 100%);
      min-height: 100vh;
      color: #1e293b;
    }

    h1, h2, h3, .font-display {
      font-family: 'Fredoka', sans-serif;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes happyHop {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-16px) scale(1.06); }
      65% { transform: translateY(-5px) scale(1.03); }
    }

    @keyframes nudgeTilt {
      0%, 100% { transform: rotate(0deg); }
      35% { transform: rotate(-6deg); }
      70% { transform: rotate(6deg); }
    }

    .anim-float { animation: gentleFloat 3s ease-in-out infinite; }
    .anim-hop { animation: happyHop 0.8s ease-in-out 2; }
    .anim-tilt { animation: nudgeTilt 0.65s ease-in-out 2; }
  </style>
</head>

    // =========================================================================

      { key: 'juneteenth',     title: 'Juneteenth',        img: './assets/chibi/holidays/juneteenth.jpg' },

      { key: 'labor_day',      title: 'Labor Day',         img: './assets/chibi/holidays/labor_day.jpg' },

    const SUBJECTS = [
      { id: 'math',    title: 'Math',    badge: '➕', note: 'Arithmetic, patterns, fractions & algebra' },
      { id: 'reading', title: 'Reading', badge: '📖', note: 'Vocabulary, context clues, grammar & roots' },

    ];

    const TIERS = ['Foundations', 'Steady Pace', 'Stretch', 'Challenge'];

    // =========================================================================
    // 2. SAVED LEARNER STATE (COMPATIBLE WITH ALL BROWSERS)
    // =========================================================================
    const STORE_KEY = 'dinonest_adaptedmind_2d_v2';

    function makeDefaultState() {
      return {
        name: 'Learner',
        bdayMonth: '',
        bdayDay: '',
        grade: 2,
        subject: 'math',
        view: 'lesson',
        buddyId: 'image_0',
        holidayKey: '',
        unlocked: ['image_0', 'image_1'],
        stars: 30,
        xp: 0,
        streak: 0,
        bestStreak: 0,
        tierIndex: 0,
        totalAnswered: 0,
        totalCorrect: 0,
        bySubject: {
          math: { answered: 0, correct: 0 },
          reading: { answered: 0, correct: 0 },
          science: { answered: 0, correct: 0 }
        }
      };
    }

    function loadSavedState() {
      const base = makeDefaultState();
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return base;
        const data = JSON.parse(raw) || {};
        const sub = data.bySubject || {};
        return {
          name: typeof data.name === 'string' && data.name.trim() ? data.name : base.name,
          bdayMonth: data.bdayMonth !== undefined ? String(data.bdayMonth) : '',
          bdayDay: data.bdayDay !== undefined ? String(data.bdayDay) : '',
          grade: Number(data.grade) >= 1 && Number(data.grade) <= 6 ? Number(data.grade) : base.grade,
          subject: ['math', 'reading', 'science'].includes(data.subject) ? data.subject : base.subject,
          view: ['lesson', 'wardrobe', 'games', 'stats'].includes(data.view) ? data.view : base.view,
          buddyId: typeof data.buddyId === 'string' ? data.buddyId : base.buddyId,
          holidayKey: typeof data.holidayKey === 'string' ? data.holidayKey : '',
          unlocked: Array.isArray(data.unlocked) && data.unlocked.length ? data.unlocked : base.unlocked,
          stars: Number.isFinite(Number(data.stars)) ? Number(data.stars) : base.stars,
          xp: Number.isFinite(Number(data.xp)) ? Number(data.xp) : base.xp,
          streak: Number.isFinite(Number(data.streak)) ? Number(data.streak) : 0,
          bestStreak: Number.isFinite(Number(data.bestStreak)) ? Number(data.bestStreak) : 0,
          tierIndex: Number.isFinite(Number(data.tierIndex)) ? Math.max(0, Math.min(3, Number(data.tierIndex))) : 0,
          totalAnswered: Number.isFinite(Number(data.totalAnswered)) ? Number(data.totalAnswered) : 0,
          totalCorrect: Number.isFinite(Number(data.totalCorrect)) ? Number(data.totalCorrect) : 0,
          bySubject: {
            math: {
              answered: Number((sub.math && sub.math.answered) || 0),
              correct: Number((sub.math && sub.math.correct) || 0)
            },
            reading: {
              answered: Number((sub.reading && sub.reading.answered) || 0),
              correct: Number((sub.reading && sub.reading.correct) || 0)
            },
            science: {
              answered: Number((sub.science && sub.science.answered) || 0),
              correct: Number((sub.science && sub.science.correct) || 0)
            }
          }
        };
      } catch (e) {
        return base;
      }
    }

    let appState = loadSavedState();

    function persistState() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(appState));
      } catch (e) {}
    }

    function applyBirthdayUnlock() {
      if (!appState.bdayMonth || !appState.bdayDay) return;
      const now = new Date();
      const matchesToday =
        (now.getMonth() + 1) === Number(appState.bdayMonth) &&
        now.getDate() === Number(appState.bdayDay);
      if (matchesToday && !appState.unlocked.includes('image_12')) {
        appState.unlocked.push('image_12');
        appState.buddyId = 'image_12';
        appState.holidayKey = '';
        persistState();
      }
    }

    // Transient UI & mini-game state
    let question = null;
    let pickedChoice = null;
    let outcome = null;
    let showGuide = false;
    let buddyAnim = 'anim-float';
    let statusBanner = 'Pick an answer to earn Stars and grow your streak.';

    let arcadeMode = 'match';
    let cards = [];
    let flipped = [];
    let matchedCount = 0;
    let moveCount = 0;
    let boardLocked = false;

    let quickPoints = 0;
    let quickSeconds = 25;
    let quickActive = false;
    let quickItem = null;
    let quickTimer = null;

    // =========================================================================
    // 3. ADAPTED-MIND STYLE QUESTION GENERATOR
    // =========================================================================
    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pickRandom(list) {
      return list[rand(0, list.length - 1)];
    }

    function shuffleList(list) {
      const arr = list.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = rand(0, i);
        const tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
      return arr;
    }

    function buildNumberOptions(answer, span) {
      const s = span || 6;
      const options = new Set([answer]);
      let tries = 0;
      while (options.size < 4 && tries < 50) {
        tries++;
        const candidate = answer + rand(-s, s);
        if (candidate >= 0 && candidate !== answer) {
          options.add(candidate);
        }
      }
      while (options.size < 4) {
        options.add(answer + options.size + 2);
      }
      return shuffleList(Array.from(options).map(String));
    }

    function makeMathItem(grade, tier) {
      const boost = grade + tier;
      if (grade <= 2) {
        const kind = rand(1, 3);
        if (kind === 1) {
          const a = rand(2, 10 + boost * 3);
          const b = rand(2, 9 + boost * 2);
          const ans = a + b;
          return {
            topic: 'Grade ' + grade + ' • Addition',
            text: 'Add the two numbers together:',
            display: a + ' + ' + b + ' = ?',
            options: buildNumberOptions(ans, 5),
            answer: String(ans),
            hint: 'Count ' + b + ' steps forward starting from ' + a + '.',
            steps: 'Start at ' + a + ' and add ' + b + ' to get ' + ans + '.'
          };
        }
        if (kind === 2) {
          const whole = rand(10, 18 + boost * 3);
          const part = rand(2, whole - 2);
          const ans = whole - part;
          return {
            topic: 'Grade ' + grade + ' • Subtraction',
            text: 'Find the missing difference:',
            display: whole + ' − ' + part + ' = ?',
            options: buildNumberOptions(ans, 5),
            answer: String(ans),
            hint: 'Take away ' + part + ' from ' + whole + '.',
            steps: whole + ' minus ' + part + ' equals ' + ans + '.'
          };
        }
        const step = rand(2, 5);
        const start = rand(1, 4) * step;
        const ans = start + step * 3;
        return {
          topic: 'Grade ' + grade + ' • Skip Counting',
          text: 'What number completes the sequence?',
          display: start + ', ' + (start + step) + ', ' + (start + step * 2) + ', ?',
          options: buildNumberOptions(ans, step * 2),
          answer: String(ans),
          hint: 'Each number increases by ' + step + '.',
          steps: 'Add ' + step + ' to ' + (start + step * 2) + ' to get ' + ans + '.'
        };
      }

      if (grade <= 4) {
        const kind = rand(1, 3);
        if (kind === 1) {
          const a = rand(2, 8 + tier * 2);
          const b = rand(3, 9 + tier);
          const ans = a * b;
          return {
            topic: 'Grade ' + grade + ' • Multiplication',
            text: 'Multiply the factors:',
            display: a + ' × ' + b + ' = ?',
            options: buildNumberOptions(ans, 10),
            answer: String(ans),
            hint: 'Think of ' + a + ' groups of ' + b + '.',
            steps: a + ' × ' + b + ' = ' + ans + '.'
          };
        }
        if (kind === 2) {
          const divisor = rand(2, 7 + tier);
          const quotient = rand(3, 9 + tier);
          const dividend = divisor * quotient;
          return {
            topic: 'Grade ' + grade + ' • Division',
            text: 'Divide evenly:',
            display: dividend + ' ÷ ' + divisor + ' = ?',
            options: buildNumberOptions(quotient, 4),
            answer: String(quotient),
            hint: 'Which number times ' + divisor + ' equals ' + dividend + '?',
            steps: divisor + ' × ' + quotient + ' = ' + dividend + ', so ' + dividend + ' ÷ ' + divisor + ' = ' + quotient + '.'
          };
        }
        const denom = pickRandom([4, 5, 6, 8]);
        const n1 = rand(1, denom - 2);
        const n2 = rand(1, denom - n1);
        const ans = (n1 + n2) + '/' + denom;
        return {
          topic: 'Grade ' + grade + ' • Fractions',
          text: 'Add the fractions with like denominators:',
          display: n1 + '/' + denom + ' + ' + n2 + '/' + denom + ' = ?',
          options: shuffleList(Array.from(new Set([
            ans,
            (n1 + n2) + '/' + (denom * 2),
            Math.max(1, n1 + n2 - 1) + '/' + denom,
            (n1 + n2 + 1) + '/' + denom
          ]))),
          answer: ans,
          hint: 'Add the numerators (' + n1 + ' + ' + n2 + ') and keep ' + denom + ' on the bottom.',
          steps: n1 + ' + ' + n2 + ' = ' + (n1 + n2) + ', giving ' + ans + '.'
        };
      }

      const kind = rand(1, 3);
      if (kind === 1) {
        const a = rand(5, 14 + tier * 2);
        const b = rand(3, 10 + tier);
        const c = rand(4, 20);
        const ans = a * b + c;
        return {
          topic: 'Grade ' + grade + ' • Order of Operations',
          text: 'Solve using order of operations:',
          display: a + ' × ' + b + ' + ' + c + ' = ?',
          options: buildNumberOptions(ans, 12),
          answer: String(ans),
          hint: 'Do multiplication (' + a + ' × ' + b + ') before adding ' + c + '.',
          steps: a + ' × ' + b + ' = ' + (a * b) + ', then ' + (a * b) + ' + ' + c + ' = ' + ans + '.'
        };
      }
      if (kind === 2) {
        const pct = pickRandom([10, 20, 25, 50]);
        const base = pct === 25 ? rand(2, 10) * 4 : rand(2, 12) * 10;
        const ans = (pct / 100) * base;
        return {
          topic: 'Grade ' + grade + ' • Percentages',
          text: 'Calculate the percentage of the number:',
          display: pct + '% of ' + base + ' = ?',
          options: buildNumberOptions(ans, 8),
          answer: String(ans),
          hint: 'Find ' + pct + '/100 of ' + base + '.',
          steps: '(' + pct + ' ÷ 100) × ' + base + ' = ' + ans + '.'
        };
      }
      const x = rand(2, 12 + tier);
      const m = rand(2, 5);
      const k = rand(2, 12);
      const total = m * x + k;
      return {
        topic: 'Grade ' + grade + ' • Equations',
        text: 'Find the value of x:',
        display: m + 'x + ' + k + ' = ' + total,
        options: buildNumberOptions(x, 4),
        answer: String(x),
        hint: 'Subtract ' + k + ' from ' + total + ', then divide by ' + m + '.',
        steps: total + ' − ' + k + ' = ' + (total - k) + ', and ' + (total - k) + ' ÷ ' + m + ' = ' + x + '.'
      };
    }

    const READING_ITEMS = [
      { minG: 1, maxG: 3, topic: 'Vocabulary', text: 'Which word means almost the same as "tiny"?', display: 'Synonym: TINY', options: ['Small', 'Giant', 'Heavy', 'Loud'], answer: 'Small', hint: 'Look for a word that means very little in size.', steps: '"Small" has a meaning close to "tiny".' },
      { minG: 1, maxG: 3, topic: 'Opposites', text: 'Which word is the opposite of "above"?', display: 'Antonym: ABOVE', options: ['Below', 'Over', 'High', 'Top'], answer: 'Below', hint: 'If something is over your head, the opposite is under it.', steps: '"Below" means lower than or under, which is opposite to "above".' },
      { minG: 1, maxG: 3, topic: 'Parts of Speech', text: 'Which word is a noun in: "The dino jumped over a log"?', display: '"The dino jumped over a log"', options: ['log', 'jumped', 'over', 'quickly'], answer: 'log', hint: 'A noun names a person, place, or thing.', steps: '"Log" names a physical object, so it is a noun.' },
      { minG: 1, maxG: 3, topic: 'Context Clues', text: '"Bram was famished after walking all morning, so he ate a huge lunch." What does famished mean?', display: 'Context: FAMISHED', options: ['Very hungry', 'Very sleepy', 'Very neat', 'Very quiet'], answer: 'Very hungry', hint: 'Eating a huge lunch is a clue for how Bram felt.', steps: 'Eating a large meal after a long morning shows Bram was very hungry.' },
      { minG: 4, maxG: 6, topic: 'Context Clues', text: '"Pia gave a concise answer using only ten clear words." What does concise mean?', display: 'Context: CONCISE', options: ['Short and clear', 'Confusing and long', 'Angry and loud', 'Funny and silly'], answer: 'Short and clear', hint: 'Notice that Pia used only ten clear words.', steps: 'Concise means giving a lot of information clearly and in few words.' },
      { minG: 4, maxG: 6, topic: 'Word Roots', text: 'The root "bio" relates to life. What does "biology" study?', display: 'Root: BIO-', options: ['Living things', 'Mountains and valleys', 'Stars and planets', 'Ancient coins'], answer: 'Living things', hint: 'Connect "bio" (life) with "-ology" (study of).', steps: 'Biology is the scientific study of living organisms.' },
      { minG: 4, maxG: 6, topic: 'Figurative Language', text: '"The wind whispered secrets through the tall pines." This is an example of:', display: '"wind whispered secrets"', options: ['Personification', 'Multiplication', 'Division', 'Fact table'], answer: 'Personification', hint: 'Whispering secrets is a human action given to the wind.', steps: 'Giving human traits like whispering to non-human wind is personification.' },
      { minG: 4, maxG: 6, topic: 'Grammar', text: 'Choose the best word: "Neither the leaves nor the branch _____ moving."', display: 'Subject-Verb Agreement', options: ['was', 'were', 'are', 'be'], answer: 'was', hint: 'Look at the closer singular subject ("branch").', steps: 'With "neither... nor" and singular "branch", "was" is the matching singular verb.' }
    ];

    const SCIENCE_ITEMS = [
      { minG: 1, maxG: 3, topic: 'Fossils', text: 'Where do scientists usually find dinosaur fossils?', display: 'Earth & Fossils', options: ['Sedimentary rock layers', 'Inside clouds', 'On the Moon', 'Inside boiling water'], answer: 'Sedimentary rock layers', hint: 'Sediment builds up over long periods of time.', steps: 'Fossils form when remains are buried under layers of sediment that turn to rock.' },
      { minG: 1, maxG: 3, topic: 'Animal Diets', text: 'An animal that eats both plants and other animals is called an:', display: 'Food Chains', options: ['Omnivore', 'Herbivore', 'Mineral', 'Planet'], answer: 'Omnivore', hint: 'Omni means "all".', steps: 'Omnivores eat both plant and animal foods.' },
      { minG: 1, maxG: 3, topic: 'Weather & Water', text: 'When water warms up and turns into water vapor, that process is called:', display: 'Water Cycle', options: ['Evaporation', 'Freezing', 'Erosion', 'Orbiting'], answer: 'Evaporation', hint: 'Think of puddles drying up on a sunny day.', steps: 'Evaporation happens when liquid water changes into gas (water vapor).' },
      { minG: 1, maxG: 3, topic: 'Space', text: 'Which planet do we live on?', display: 'Our Solar System', options: ['Earth', 'Saturn', 'Neptune', 'Mercury'], answer: 'Earth', hint: 'It is the third planet from the Sun.', steps: 'Earth is our home planet in the solar system.' },
      { minG: 4, maxG: 6, topic: 'Earth Science', text: 'What slowly moves Earth’s tectonic plates over millions of years?', display: 'Plate Tectonics', options: ['Convection in the mantle', 'Ocean tides alone', 'Solar eclipses', 'Wind gusts'], answer: 'Convection in the mantle', hint: 'Heat from Earth’s interior creates slow currents in the mantle.', steps: 'Heat-driven convection currents in the mantle push and move tectonic plates.' },
      { minG: 4, maxG: 6, topic: 'Ecology', text: 'In an ecosystem, organisms like fungi and bacteria that break down dead matter are:', display: 'Ecosystem Roles', options: ['Decomposers', 'Producers', 'Asteroids', 'Satellites'], answer: 'Decomposers', hint: 'They recycle nutrients back into the soil.', steps: 'Decomposers break down dead organic material and return nutrients to the environment.' },
      { minG: 4, maxG: 6, topic: 'Energy', text: 'A flashlight uses chemical energy from a battery and converts it mainly into:', display: 'Energy Transformation', options: ['Light and thermal energy', 'Sound and gravity', 'Fossils and rock', 'Magnetism only'], answer: 'Light and thermal energy', hint: 'A flashlight gives off light and a little warmth.', steps: 'Batteries supply electrical/chemical energy that the bulb turns into light and heat.' },
      { minG: 4, maxG: 6, topic: 'Astronomy', text: 'Why does the Moon appear to change shape over a month?', display: 'Phases of the Moon', options: ['We see different lit portions from Earth', 'The Moon shrinks and grows', 'Clouds cover half the Moon', 'Earth blocks it every night'], answer: 'We see different lit portions from Earth', hint: 'Half of the Moon is always lit by the Sun.', steps: 'As the Moon orbits Earth, we see varying angles of its sunlit side.' }
    ];

    function generateNextQuestion() {
      if (appState.subject === 'math') {
        return makeMathItem(appState.grade, appState.tierIndex);
      }
      const source = appState.subject === 'reading' ? READING_ITEMS : SCIENCE_ITEMS;
      const matching = source.filter(function (item) {
        return appState.grade >= item.minG && appState.grade <= item.maxG;
      });
      const chosen = pickRandom(matching.length ? matching : source);
      return {
        topic: chosen.topic,
        text: chosen.text,
        display: chosen.display,
        options: shuffleList(chosen.options),
        answer: chosen.answer,
        hint: chosen.hint,
        steps: chosen.steps
      };
    }

    function advanceQuestion() {
      question = generateNextQuestion();
      pickedChoice = null;
      outcome = null;
      showGuide = false;
      buddyAnim = 'anim-float';
      renderApp();
    }

    // =========================================================================
    // 4. 2D IMAGE HELPERS (PNG & JPG ONLY)
    // =========================================================================
    function currentDino() {
      return DINO_ROSTER.find(function (d) { return d.id === appState.buddyId; }) || DINO_ROSTER[0];
    }

    function currentDisplayImage() {
      const holiday = HOLIDAY_CARDS.find(function (h) { return h.key === appState.holidayKey; });
      if (holiday && holiday.img) {
        return holiday.img;
      }
      return currentDino().img;
    }

    function currentHolidayLabel() {
      const holiday = HOLIDAY_CARDS.find(function (h) { return h.key === appState.holidayKey; });
      return holiday && holiday.key ? holiday.title : 'Standard Chibi';
    }

    // =========================================================================
    // 5. INTERACTIONS
    // =========================================================================
    function answerQuestion(option) {
      if (outcome !== null) return;
      pickedChoice = option;
      appState.totalAnswered += 1;
      appState.bySubject[appState.subject].answered += 1;

      if (option === question.answer) {
        outcome = 'right';
        buddyAnim = 'anim-hop';
        appState.totalCorrect += 1;
        appState.bySubject[appState.subject].correct += 1;
        appState.streak += 1;
        appState.bestStreak = Math.max(appState.bestStreak, appState.streak);

        const streakBonus = appState.streak >= 3 ? 5 : 0;
        const gainedStars = 5 + streakBonus;
        appState.stars += gainedStars;
        appState.xp += 15 + appState.tierIndex * 5;

        if (appState.streak % 3 === 0 && appState.tierIndex < TIERS.length - 1) {
          appState.tierIndex += 1;
          statusBanner = 'Correct! Moved up to ' + TIERS[appState.tierIndex] + ' (+' + gainedStars + ' Stars).';
        } else {
          statusBanner = 'Correct! Earned +' + gainedStars + ' Stars' + (streakBonus ? ' (includes streak bonus)' : '') + '.';
        }
      } else {
        outcome = 'wrong';
        buddyAnim = 'anim-tilt';
        showGuide = true;
        appState.streak = 0;
        if (appState.tierIndex > 0) {
          appState.tierIndex -= 1;
        }
        statusBanner = 'Not quite—check the step-by-step guide below and try the next one.';
      }

      persistState();
      renderApp();
    }

    function changeGrade(g) {
      appState.grade = g;
      persistState();
      advanceQuestion();
    }

    function changeSubject(subj) {
      appState.subject = subj;
      persistState();
      advanceQuestion();
    }

    function changeView(v) {
      if (quickTimer && v !== 'games') {
        endQuickQuiz(false);
      }
      appState.view = v;
      if (v === 'games' && cards.length === 0) {
        setupMatchCards();
      }
      persistState();
      renderApp();
    }

    function chooseDino(id) {
      if (!appState.unlocked.includes(id)) return;
      appState.buddyId = id;
      appState.holidayKey = '';
      buddyAnim = 'anim-hop';
      persistState();
      renderApp();
    }

    function buyDino(id) {
      const target = DINO_ROSTER.find(function (d) { return d.id === id; });
      if (!target || appState.unlocked.includes(id) || appState.stars < target.cost) return;
      appState.stars -= target.cost;
      appState.unlocked.push(id);
      appState.buddyId = id;
      appState.holidayKey = '';
      buddyAnim = 'anim-hop';
      statusBanner = 'Unlocked ' + target.name + ' (' + target.role + ')!';
      persistState();
      renderApp();
    }

    function chooseHoliday(key) {
      appState.holidayKey = key;
      buddyAnim = 'anim-hop';
      persistState();
      renderApp();
    }

    function saveLearnerField(key, val) {
      appState[key] = val;
      applyBirthdayUnlock();
      persistState();
      renderApp();
    }

    // =========================================================================
    // 6. 2D ARCADE GAMES (PNG & JPG ONLY)
    // =========================================================================
    function setupMatchCards() {
      const selected = shuffleList(DINO_ROSTER).slice(0, 6);
      cards = shuffleList(selected.concat(selected)).map(function (dino, index) {
        return {
          index: index,
          id: dino.id,
          name: dino.name,
          img: dino.img,
          matched: false
        };
      });
      flipped = [];
      matchedCount = 0;
      moveCount = 0;
      boardLocked = false;
    }

    function selectMatchCard(idx) {
      if (boardLocked) return;
      const card = cards[idx];
      if (!card || card.matched || flipped.indexOf(idx) !== -1) return;

      flipped.push(idx);
      renderApp();

      if (flipped.length === 2) {
        moveCount += 1;
        boardLocked = true;
        const a = flipped[0];
        const b = flipped[1];
        if (cards[a].id === cards[b].id) {
          setTimeout(function () {
            cards[a].matched = true;
            cards[b].matched = true;
            flipped = [];
            matchedCount += 1;
            boardLocked = false;
            if (matchedCount === 6) {
              appState.stars += 15;
              appState.xp += 25;
              persistState();
            }
            renderApp();
          }, 400);
        } else {
          setTimeout(function () {
            flipped = [];
            boardLocked = false;
            renderApp();
          }, 700);
        }
      }
    }

    function makeQuickPrompt() {
      const limit = appState.grade * 5 + 5;
      const x = rand(1, limit);
      const y = rand(1, limit);
      const plus = Math.random() >= 0.4 || x < y;
      const ans = plus ? x + y : x - y;
      return {
        label: plus ? (x + ' + ' + y) : (x + ' − ' + y),
        answer: String(ans),
        options: buildNumberOptions(ans, 4)
      };
    }

    function startQuickQuiz() {
      endQuickQuiz(false);
      quickPoints = 0;
      quickSeconds = 25;
      quickActive = true;
      quickItem = makeQuickPrompt();
      renderApp();

      quickTimer = setInterval(function () {
        quickSeconds -= 1;
        if (quickSeconds <= 0) {
          endQuickQuiz(true);
        } else {
          renderApp();
        }
      }, 1000);
    }

    function endQuickQuiz(awardStars) {
      if (quickTimer) {
        clearInterval(quickTimer);
        quickTimer = null;
      }
      if (awardStars && quickActive && quickPoints > 0) {
        appState.stars += quickPoints * 2;
        appState.xp += quickPoints * 5;
        persistState();
      }
      quickActive = false;
      renderApp();
    }

    function answerQuickQuiz(opt) {
      if (!quickActive || !quickItem) return;
      if (opt === quickItem.answer) {
        quickPoints += 1;
      }
      quickItem = makeQuickPrompt();
      renderApp();
    }

    // =========================================================================
    // 7. VIEWS
    // =========================================================================
    function renderHeader() {
      const dino = currentDino();
      const imgUrl = currentDisplayImage();
      const level = Math.floor(appState.xp / 100) + 1;

      const tabs = [
        { id: 'lesson', label: 'Practice' },
        { id: 'wardrobe', label: 'Dinos & Holidays' },
        { id: 'games', label: '2D Mini-Games' },
        { id: 'stats', label: 'Progress & Birthday' }
      ].map(function (tab) {
        const active = appState.view === tab.id;
        return (
          '<button onclick="changeView(\'' + tab.id + '\')" class="px-3.5 py-2 rounded-2xl text-sm font-extrabold transition ' +
          (active ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-sky-50 hover:text-sky-700') +
          '">' + tab.label + '</button>'
        );
      }).join('');

      const grades = [1, 2, 3, 4, 5, 6].map(function (g) {
        const active = appState.grade === g;
        return (
          '<button onclick="changeGrade(' + g + ')" class="w-7 h-7 rounded-xl text-xs font-extrabold transition ' +
          (active ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-white') +
          '">' + g + '</button>'
        );

      return (
        '<header class="bg-white/95 border border-sky-100 rounded-3xl shadow-sm p-4 mb-5">' +
          '<div class="flex flex-wrap items-center justify-between gap-3">' +
            '<div class="flex items-center gap-3">' +
              '<img src="' + BRAND_LOGO + '" alt="DinoNest Labs Logo" class="w-12 h-12 rounded-2xl object-contain bg-sky-50 p-1 border border-sky-100" />' +
              '<div>' +
                '<div class="flex items-center gap-2">' +
                  '<h1 class="text-xl md:text-2xl font-bold text-slate-800">DinoNest Labs</h1>' +
                  '<span class="text-xs font-extrabold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800">Grade ' + appState.grade + '</span>' +
                '</div>' +
                '<p class="text-xs font-bold text-slate-500">' + dino.name + ' • ' + currentHolidayLabel() + '</p>' +
              '</div>' +
            '</div>' +
            '<div class="flex flex-wrap items-center gap-2">' +
              '<div class="px-3 py-1.5 rounded-2xl bg-amber-50 border border-amber-200 text-sm font-extrabold text-amber-900">⭐ ' + appState.stars + ' Stars</div>' +
              '<div class="px-3 py-1.5 rounded-2xl bg-orange-50 border border-orange-200 text-sm font-extrabold text-orange-900">🔥 ' + appState.streak + ' Streak</div>' +
              '<div class="flex items-center gap-2 px-3 py-1.5 rounded-2xl bg-sky-50 border border-sky-200 text-sm font-extrabold text-sky-900">' +
                '<img src="' + imgUrl + '" alt="' + dino.name + '" class="w-6 h-6 rounded-full object-contain bg-white" />' +
                '<span>Lv.' + level + ' (' + appState.xp + ' XP)</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2">' +
            '<div class="flex flex-wrap gap-1.5">' + tabs + '</div>' +
            '<div class="flex items-center gap-1 bg-slate-100 p-1 rounded-2xl">' +
              '<span class="text-xs font-extrabold text-slate-500 px-2">Grade:</span>' + grades +
            '</div>' +
          '</div>' +
        '</header>'
      );
    }

    function renderLessonView() {
      if (!question) question = generateNextQuestion();
      const dino = currentDino();
      const imgUrl = currentDisplayImage();
      const tierName = TIERS[appState.tierIndex];

      const subjectsHtml = SUBJECTS.map(function (sub) {
        const active = appState.subject === sub.id;
        return (
          '<button onclick="changeSubject(\'' + sub.id + '\')" class="text-left p-3.5 rounded-3xl border-2 transition flex items-center gap-3 ' +
          (active ? 'bg-white border-sky-500 shadow-xs' : 'bg-white/80 border-slate-200 hover:border-sky-300') + '">' +
            '<span class="text-2xl">' + sub.badge + '</span>' +
            '<div>' +
              '<div class="font-display font-bold text-base ' + (active ? 'text-sky-700' : 'text-slate-800') + '">' + sub.title + '</div>' +
              '<div class="text-xs font-semibold text-slate-500">' + sub.note + '</div>' +
            '</div>' +
          '</button>'
        );
      }).join('');

      const letters = ['A', 'B', 'C', 'D'];
      const optionsHtml = question.options.map(function (opt, i) {
        let cls = 'bg-white border-slate-200 text-slate-800 hover:border-sky-400';
        if (outcome !== null) {
          if (opt === question.answer) {
            cls = 'bg-emerald-50 border-emerald-500 text-emerald-950 ring-2 ring-emerald-200';
          } else if (opt === pickedChoice && outcome === 'wrong') {
            cls = 'bg-rose-50 border-rose-400 text-rose-950';
          } else {
            cls = 'bg-slate-50 border-slate-200 text-slate-400';
          }
        }
        const encoded = encodeURIComponent(opt);
        return (
          '<button ' + (outcome !== null ? 'disabled ' : '') +
          'onclick="answerQuestion(decodeURIComponent(\'' + encoded + '\'))" ' +
          'class="w-full text-left p-4 rounded-2xl border-2 font-bold text-base flex items-center gap-3 transition ' + cls + '">' +
            '<span class="w-8 h-8 rounded-xl bg-slate-100 text-slate-700 font-extrabold flex items-center justify-center shrink-0">' + letters[i] + '</span>' +
            '<span>' + opt + '</span>' +
          '</button>'
        );
      }).join('');

      const displayBox = question.display
        ? '<div class="my-4 py-3.5 px-5 rounded-2xl bg-sky-50 border border-sky-200 text-center font-display text-xl md:text-2xl font-bold text-sky-950">' + question.display + '</div>'
        : '';

      const guideBox = showGuide
        ? '<div class="mt-5 p-4 rounded-2xl bg-amber-50 border border-amber-300 text-amber-950 text-sm font-semibold">' +
            '<div class="font-extrabold mb-1">' + (outcome === 'wrong' ? 'Solution Walkthrough:' : 'Hint:') + '</div>' +
            '<div>' + (outcome === 'wrong' ? question.steps : question.hint) + '</div>' +
          '</div>'
        : '';

      const bannerColor = outcome === 'right' ? 'text-emerald-700' : outcome === 'wrong' ? 'text-amber-800' : 'text-slate-500';
      const nextBtn = outcome !== null
        ? '<button onclick="advanceQuestion()" class="px-6 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-display font-bold text-base">Next Question →</button>'
        : '';

      return (
        '<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-5">' + subjectsHtml + '</div>' +
        '<div class="grid grid-cols-1 lg:grid-cols-12 gap-5">' +
          '<aside class="lg:col-span-4 bg-white border border-sky-100 rounded-3xl p-5 shadow-sm flex flex-col items-center justify-between text-center">' +
            '<div class="w-full flex items-center justify-between text-xs font-extrabold">' +
              '<span class="px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-800">' + tierName + '</span>' +
              '<span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800">' + dino.specialty + '</span>' +
            '</div>' +
            '<div class="my-4 w-52 h-52 rounded-3xl bg-gradient-to-b from-sky-50 to-amber-50 border border-sky-100 flex items-center justify-center p-3">' +
              '<img src="' + imgUrl + '" alt="' + dino.name + '" class="w-full h-full object-contain ' + buddyAnim + ' select-none" />' +
            '</div>' +
            '<div class="w-full rounded-2xl bg-slate-50 border border-slate-200/80 p-3">' +
              '<div class="font-display font-bold text-lg text-slate-800">' + dino.name + '</div>' +
              '<div class="text-xs font-bold text-slate-500">' + dino.role + '</div>' +
              '<button onclick="changeView(\'wardrobe\')" class="mt-2 text-xs font-extrabold text-sky-700 hover:underline">Change Dino or Holiday Photo</button>' +
            '</div>' +
          '</aside>' +

              '<div class="flex items-center justify-between gap-2 mb-4">' +
                '<span class="text-xs font-extrabold uppercase tracking-wider px-3 py-1 rounded-full bg-amber-100 text-amber-900">' + question.topic + '</span>' +
                '<button onclick="showGuide = !showGuide; renderApp();" class="text-xs font-extrabold px-3 py-1 rounded-full bg-slate-100 text-slate-700 hover:bg-amber-100 hover:text-amber-900">' + (showGuide ? 'Hide Hint' : 'Show Hint') + '</button>' +
              '</div>' +
              '<h2 class="text-lg md:text-2xl font-bold text-slate-800">' + question.text + '</h2>' +
              displayBox +
              '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-5">' + optionsHtml + '</div>' +
              guideBox +
            '</div>' +
            '<div class="mt-6 pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">' +

              nextBtn +
            '</div>' +
          '</section>' +
        '</div>'
      );
    }

        const thumb = item.img || currentDino().img;

          '<button onclick="chooseHoliday(\'' + item.key + '\')" class="p-2.5 rounded-2xl border-2 text-center flex flex-col items-center transition ' +
          (selected ? 'bg-amber-50 border-amber-500' : 'bg-slate-50 border-slate-200 hover:border-sky-300') + '">' +
            '<img src="' + thumb + '" alt="' + item.title + '" class="w-16 h-16 rounded-xl object-contain bg-white p-1 border border-slate-100 mb-1.5" />' +

    function renderGamesView() {
      let body = '';
      if (arcadeMode === 'match') {
        const deckHtml = cards.map(function (card, i) {
          const revealed = card.matched || flipped.indexOf(i) !== -1;
          const cardCls = card.matched
            ? 'bg-emerald-50 border-emerald-400'
            : revealed
            ? 'bg-white border-sky-400'
            : 'bg-sky-600 border-sky-700 text-white';
          const faceHtml = revealed
            ? '<img src="' + card.img + '" alt="' + card.name + '" class="w-4/5 h-4/5 object-contain" /><span class="text-[11px] font-extrabold text-slate-700 mt-1">' + card.name + '</span>'

          return '<button onclick="selectMatchCard(' + i + ')" class="aspect-square rounded-2xl border-2 p-2 flex flex-col items-center justify-center transition ' + cardCls + '">' + faceHtml + '</button>';
        }).join('');

        const winBanner = matchedCount === 6
          ? '<div class="mb-4 p-3.5 rounded-2xl bg-emerald-50 border border-emerald-300 text-emerald-900 text-sm font-extrabold text-center">Board cleared in ' + moveCount + ' moves! +15 Stars added.</div>'
          : '';

        body =
          '<div class="flex items-center justify-between bg-sky-50 border border-sky-100 rounded-2xl p-3 mb-4">' +
            '<div class="text-sm font-extrabold text-sky-900">Matched: ' + matchedCount + ' / 6 pairs • Moves: ' + moveCount + '</div>' +
            '<button onclick="setupMatchCards(); renderApp();" class="px-3.5 py-1.5 rounded-xl bg-white border border-sky-200 text-xs font-extrabold text-sky-800 hover:bg-sky-100">Reset Deck</button>' +
          '</div>' +
          winBanner +
          '<div class="grid grid-cols-3 sm:grid-cols-4 gap-3 max-w-2xl mx-auto">' + deckHtml + '</div>';
      } else {
